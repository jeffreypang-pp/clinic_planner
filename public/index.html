<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Planner</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6a7385; --line: #dfe3ea;
    --accent: #2f6fed; --accent-text: #fff;
    --free: #cfeedd; --free-line: #a7dcc0; --off: #eceef2; --closed: #d9dce3;
    --away: #fde7b8; --away-text: #7a5300; --blocked: #f3b8b2; --booked: #2f6fed; --booked-text: #fff;
    --bad: #b3261e; --bad-bg: #fde8e6; --ok: #1b7a43; --ok-bg: #e3f5ea; --warn-bg: #fff4d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --panel: #1c2028; --text: #e6e9ef; --muted: #98a1b3; --line: #30363f;
      --accent: #5b8cff; --accent-text: #0b1020;
      --free: #1f4a35; --free-line: #2a6a4b; --off: #232830; --closed: #2c313a;
      --away: #5a4515; --away-text: #f7dca0; --blocked: #7a3430; --booked: #4a7bf0; --booked-text: #fff;
      --bad: #ff8a80; --bad-bg: #3b1e1c; --ok: #6fd69a; --ok-bg: #173526; --warn-bg: #3a3014;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 12px 20px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0; }
  main { padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
  main.wide { max-width: none; }   /* the timetable uses the whole window width */
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { background: none; border: 0; padding: 8px 14px; border-radius: 8px; color: var(--muted);
               font: inherit; cursor: pointer; }
  nav button.on { background: var(--accent); color: var(--accent-text); }
  .spacer { flex: 1; }
  #savebar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  #savebar .state { padding: 3px 10px; border-radius: 99px; font-weight: 600; }
  #savebar .state.clean { background: var(--ok-bg); color: var(--ok); }
  #savebar .state.dirty { background: var(--warn-bg); color: var(--away-text); }
  #savebar .state.ext { background: var(--bad-bg); color: var(--bad); }
  #savebar .btn { padding: 4px 12px; }
  label { color: var(--muted); font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
  label[hidden] { display: none; }
  input, select, textarea, button { font: inherit; color: var(--text); }
  input, select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  button.btn { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 6px;
               padding: 7px 14px; cursor: pointer; }
  button.btn.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  button.btn.danger { background: var(--bad-bg); color: var(--bad); }
  button.link { background: none; border: 0; color: var(--bad); cursor: pointer; padding: 2px 6px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 8px; font-size: 14px; }
  .muted { color: var(--muted); }
  #banner { padding: 8px 20px; display: none; }
  #banner.warn { display: block; background: var(--warn-bg); }
  #banner.err { display: block; background: var(--bad-bg); color: var(--bad); }
  #banner.ok { display: block; background: var(--ok-bg); color: var(--ok); }
  #banner ul { margin: 4px 0 0 18px; padding: 0; }

  /* timetable grid: one cell per 15 minutes, stretched to the available width (at least 14px) */
  .tt { overflow-x: auto; padding-bottom: 6px; }
  .tt-row { display: grid; align-items: stretch; margin-bottom: 2px; }
  .tt-label input.here { margin: 0 7px 0 0; vertical-align: -2px; cursor: pointer; width: 15px; height: 15px; }
  .tt-label { position: sticky; left: 0; background: var(--panel); z-index: 2; padding: 3px 8px 3px 0;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .tt-label small { color: var(--muted); }
  .tt-hour { font-size: 11px; color: var(--muted); height: 16px; overflow: visible; white-space: nowrap;
             border-left: 1px solid var(--line); padding-left: 2px; }
  .cell { height: 26px; margin-right: 1px; border-radius: 3px; font-size: 10px; overflow: hidden; white-space: nowrap; }
  .cell.free { background: var(--free); border: 1px solid var(--free-line); cursor: pointer; }
  .cell.free:hover { outline: 2px solid var(--accent); }
  .cell.off { background: var(--off); }
  .cell.closed { background: repeating-linear-gradient(45deg, var(--closed), var(--closed) 3px, var(--off) 3px, var(--off) 6px); }
  .cell.blocked { background: repeating-linear-gradient(135deg, var(--blocked), var(--blocked) 3px, transparent 3px, transparent 6px); border: 1px solid var(--blocked); }
  .tt-row { position: relative; }
  .tt.edit .tt-row[data-kind] { cursor: crosshair; touch-action: none; user-select: none; }
  .tt.edit .cell.free:hover { outline: none; }
  .tt-row > .sel { position: absolute; top: -1px; bottom: -1px; z-index: 3; pointer-events: none; border: 2px solid var(--accent);
         background: color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 4px; }
  #editbar b { font-size: 15px; }
  .cell.away { background: var(--away); color: var(--away-text); text-align: center; line-height: 26px; font-weight: 600; }
  .cell.booked { background: var(--booked); color: var(--booked-text); padding: 0 4px; line-height: 26px; cursor: default; }
  .tt h4 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 6px 0 12px; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px;
                         margin-right: 5px; vertical-align: -2px; background: var(--c); }

  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .card table th:first-child:last-of-type, .card tr > th:first-child { white-space: nowrap; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .pill.yes { background: var(--ok-bg); color: var(--ok); }
  .pill.no { background: var(--bad-bg); color: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { background: var(--free); border: 1px solid var(--free-line); border-radius: 6px; padding: 2px 8px;
          cursor: pointer; font-size: 12px; color: var(--text); }
  .reasons { margin: 6px 0 0 18px; padding: 0; color: var(--bad); }
  textarea.json { width: 100%; height: 420px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  .hours td { padding: 3px 8px; }
  .days { display: flex; gap: 8px; }
  table.roster td, table.roster th { padding: 3px 4px; text-align: center; }
  table.roster td:first-child, table.roster th:first-child { text-align: left; white-space: nowrap; }
  table.roster select { padding: 3px 4px; min-width: 96px; }
  table.roster select.set { background: var(--free); border-color: var(--free-line); }
  table.roster select.exc { border-color: var(--away-text); box-shadow: inset 0 0 0 1px var(--away-text); }   /* not at their usual location */
  table.training td, table.training th { text-align: center; padding: 6px 10px; }
  table.training td:first-child, table.training th:first-child { text-align: left; white-space: nowrap; }
  table.training th small { display: block; font-weight: 400; color: var(--muted); }
  table.training td.t-yes { background: var(--free); }                          /* trained, and the equipment needs it */
  table.training td.t-spare { background: color-mix(in srgb, var(--free) 35%, transparent); }   /* trained, though nothing requires it (yet) */
  table.training td.t-no { background: repeating-linear-gradient(135deg, var(--off), var(--off) 4px, transparent 4px, transparent 8px); }   /* needs training and they have none */
  table.training input { width: 17px; height: 17px; cursor: pointer; }
  table.training tr.need-row td { background: var(--bg); font-size: 12px; color: var(--muted); }
  table.roster tr.group td { background: var(--bg); color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .tt-layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
  .tt-main { min-width: 0; }
  .book-panel { position: sticky; top: 8px; margin-bottom: 0; max-height: calc(100vh - 24px); overflow-y: auto; }
  @media (max-width: 1150px) { .tt-layout { grid-template-columns: 1fr; } .book-panel { position: static; max-height: none; } }
  .bk-head { position: sticky; top: -14px; z-index: 5; background: var(--panel); margin: -14px -14px 10px; padding: 12px 14px;
             border-bottom: 1px solid var(--line); border-radius: 10px 10px 0 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bk-head .btn { padding: 7px 18px; font-weight: 600; }
  .bk-lists { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .bk-row { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 8px; }
  .bk-row.ok { border-color: var(--free-line); background: color-mix(in srgb, var(--free) 35%, transparent); }
  .bk-row.bad { border-color: var(--bad); }
  .bk-fold { display: flex; gap: 6px; align-items: center; }
  button.tog, button.tog:hover { padding: 0 4px; font-size: 13px; text-decoration: none; color: var(--muted); }
  .bk-fold .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bk-edit { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .bk-edit select, .bk-edit input { flex: 1; min-width: 0; }
  .bk-edit .n { color: var(--muted); width: 18px; }
  .bk-mins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 6px; }
  .bk-mins label, .bk-edit label { font-size: 11px; }
  .bk-mins select { width: 100%; }
  .bk-edit .grow { flex: 1; min-width: 0; }
  .bk-steps { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .bk-step { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 3px; }
  .bk-step select, td select.assign { max-width: 150px; font-size: 12px; padding: 2px 4px; }
  .tt-row.total-row { margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--line); }
  .tt-row.total-row .tt-label { font-weight: 600; }
  .tt-row.skill-head { margin-top: 4px; }
  .tt-row.skill-row .tt-label { padding-left: 22px; }
  .cell.tot { text-align: center; line-height: 26px; font-size: 11px; font-weight: 700; }
  .cell.tot.none { background: transparent; border: 1px dashed var(--line); }
  .cell.tot.ok { background: var(--free); border: 1px solid var(--free-line); }
  .cell.tot.full { background: var(--away); color: var(--away-text); }
  .cell.tot.over { background: var(--bad-bg); color: var(--bad); box-shadow: inset 0 0 0 2px var(--bad); }
  .book-panel .btn { padding: 5px 10px; }
  .cell.booked.latest { box-shadow: 0 0 0 2px var(--away-text); position: relative; z-index: 1; }
  #login { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--bg); padding: 16px; }
  #login[hidden] { display: none; }
  #login form, #login .box { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  #login h2 { margin: 0 0 4px; font-size: 18px; }
  #login input { width: 100%; margin: 12px 0 10px; padding: 9px 10px; font-size: 15px; }
  #login .btn { width: 100%; padding: 9px; }
  #login .err { color: var(--bad); min-height: 1.4em; margin-top: 8px; font-size: 13px; }
  #dirpick { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; }
  #dirpick[hidden] { display: none; }
  #dirpick .box { width: 100%; max-width: 640px; max-height: 86vh; display: flex; flex-direction: column; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  #dirpick h3 { margin: 0; }
  #dirpick .dp-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #dirpick .dp-bar input { flex: 1; min-width: 200px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  #dirpick #dp-note { min-height: 2.6em; }   /* a fixed height, so changing the note never shifts the list under the pointer */
  #dirpick .dp-list { flex: 1; min-height: 180px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
  #dirpick .dp-item { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 7px 10px; cursor: pointer; font-size: 14px; }
  #dirpick .dp-item:hover, #dirpick .dp-item:focus-visible { background: var(--bg); }
  #dirpick .dp-item .tag { margin-left: auto; font-size: 11px; padding: 1px 8px; border-radius: 99px; background: var(--ok-bg); color: var(--ok); font-weight: 600; }
  #dirpick .dp-item.file { padding-left: 14px; }
  #dirpick .dp-item.dim { color: var(--muted); }
  #dirpick .btn, #dirpick .dp-item, #dirpick h3 { user-select: none; }
  #dirpick .dp-item.picked { background: color-mix(in srgb, var(--accent) 18%, transparent); outline: 2px solid var(--accent); outline-offset: -2px; }
  #dirpick .dp-item .size { margin-left: auto; font-size: 11px; color: var(--muted); }
  #dirpick .dp-item .tag + .size { margin-left: 8px; }
  #dirpick .dp-fname { display: flex; gap: 8px; align-items: center; }
  #dirpick .dp-fname[hidden] { display: none; }
  #dirpick .dp-fname input { flex: 1; }
  #dirpick .dp-item.new { color: var(--accent); font-weight: 600; }
  #dirpick .dp-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #dirpick .dp-actions .spacer { flex: 1; }
  .dirbox { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .dirbox label { flex: 1; min-width: 260px; }
  .dirbox input { width: 100%; }
  .gtabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .days label { flex-direction: row; align-items: center; gap: 3px; color: var(--text); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Clinic Planner</h1>
  <nav id="nav"></nav>
  <span class="spacer"></span>
  <div id="savebar"></div>
  <button class="btn secondary" id="logout" hidden title="Log out of the app">Log out</button>
  <label id="date-wrap" hidden>Date <input type="date" id="date"></label>   <!-- only the Roster tab needs it up here; the Timetable has its own beside Location -->
</header>
<div id="login" hidden>
  <form id="login-form" autocomplete="on">
    <h2>Clinic Planner</h2>
    <div class="muted" id="login-msg">Enter the password to continue.</div>
    <input type="password" id="login-pw" name="password" autocomplete="current-password" placeholder="Password" required>
    <button class="btn" type="submit">Log in</button>
    <div class="err" id="login-err" role="alert"></div>
  </form>
  <div class="box" id="login-setup" hidden><h2>Password not set up</h2>
    <div class="muted">This deployment needs a password before it will show any data. Set <code>CLINIC_PASSWORD</code>
      (Vercel: Project Settings → Environment Variables), then redeploy.</div></div>
</div>
<div id="dirpick" hidden role="dialog" aria-modal="true" aria-label="Choose a directory">
  <div class="box">
    <h3 id="dp-title">Choose a directory</h3>
    <div class="dp-bar" id="dp-shortcuts"></div>
    <div class="dp-bar"><button class="btn secondary" id="dp-up" title="Go up one folder">↑ Up</button>
      <input id="dp-input" spellcheck="false" autocomplete="off" title="Type a path and press Enter to go there"></div>
    <div class="muted" id="dp-note"></div>
    <div class="dp-list" id="dp-list"></div>
    <div class="dp-fname" id="dp-filerow" hidden><label for="dp-filename" style="font-size:13px;color:var(--text)">File name</label><input id="dp-filename" spellcheck="false" autocomplete="off"></div>
    <div class="dp-actions"><label style="flex-direction:row;align-items:center;gap:4px;color:var(--text)"><input type="checkbox" id="dp-hidden"> show hidden</label>
      <button class="btn secondary" id="dp-new">New folder…</button><span class="spacer"></span>
      <button class="btn secondary" id="dp-cancel">Cancel</button><button class="btn" id="dp-ok">Choose this folder</button></div>
  </div>
</div>
<div id="banner"></div>
<main id="main"></main>

<script>
const TABS = [["timetable", "Timetable"], ["roster", "Roster & bookings"], ["training", "Staff training"], ["setup", "Setup & save"]];
const S = { stateless: false, auth: false, state: null, list: { items: [], last: null, summary: "" }, editAvail: false, sel: null, clinic: null, issues: [], tab: "timetable", date: null, location: null, tt: null,
            rosterForm: { who: null, location: "", from: null, to: null, days: [0,1,2,3,4,5,6] }, weekOf: null, setupGroup: "resources" };

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slotStr = i => String(Math.floor(i / 4)).padStart(2, "0") + ":" + String((i % 4) * 15).padStart(2, "0");
const timeOptions = (sel, max = 96) => Array.from({length: max + 1}, (_, i) =>
  `<option value="${slotStr(i)}" ${slotStr(i) === sel ? "selected" : ""}>${slotStr(i)}</option>`).join("");
// ---- opening hours and start times: only offer start times that fit inside opening hours ----
const WEEKDAY_KEYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
const slotOf = hhmm => { const [h, m] = hhmm.split(":").map(Number); return h * 4 + m / 15; };
// [open, close] in 15-minute slots for a date (honours one-off date_overrides), or null when closed
function hoursOn(loc, iso) {
  const ov = loc.date_overrides || {};
  const raw = iso in ov ? ov[iso] : loc.opening_hours[WEEKDAY_KEYS[(new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7]];
  return raw ? [slotOf(raw[0]), slotOf(raw[1])] : null;
}
// The start times to offer: from opening time to the latest start that still ends by closing time.
// `spans` = opening hours of the location(s) in question. A `current` value outside them is kept (and flagged) so the
// screen never shows a time that differs from the one that will be used.
function startOptions(spans, minutes, current) {
  const need = Math.max(1, Math.ceil(minutes / 15)), ok = new Set();
  for (const [open, close] of spans) for (let i = open; i + need <= close; i++) ok.add(i);
  const cur = current ? slotOf(current) : null, outside = cur !== null && !ok.has(cur);
  const all = [...ok]; if (outside) all.push(cur);
  all.sort((a, b) => a - b);
  const reason = ok.size ? "" : spans.length ? "This treatment is longer than the opening hours." : "Closed on this date.";
  return { options: all.map(i => ({ value: slotStr(i), label: slotStr(i) + (outside && i === cur ? " (outside opening hours)" : "") })),
           outside, reason, first: ok.size ? slotStr(Math.min(...ok)) : null };
}
const startSelectHtml = (r, sel, attrs) => `<select ${attrs}>${r.options.map(o => `<option value="${o.value}" ${o.value === sel ? "selected" : ""}>${o.label}</option>`).join("")}</select>`;
const byId = (list, id) => list.find(x => x.id === id);
const totalMin = t => t.numbing_minutes + t.doctor_minutes + t.staff_minutes;
const STEP_TAG = { numbing: " · numbing", doctor: "", staff: " · staff tx", all: "" };
const STEP_KEYS = ["numbing", "doctor", "staff"];                       // a row's minutes fields are named like the steps
const activeSteps = it => STEP_KEYS.filter(k => +it[k] > 0);
// who does which step: a staff id, or null = "assign later" (then it only counts as one staff member needed)
const staffPayload = it => Object.fromEntries(activeSteps(it).map(k => [k, it.staffIds[k] || null]));
const stepWho = x => [x.doctor, x.staff || "assign later"].filter(Boolean).join(" + ");
// a select to name (or clear) the staff member of one step of a booking
const assignSelect = (b, x) => `<select class="assign" data-assign="${b.id}" data-step="${x.name}" title="Who does this step. “assign later” still counts as one staff member needed."><option value="">assign later</option>${x.staff_options.map(o => `<option value="${o.id}" ${o.id === x.staff_id ? "selected" : ""}>${esc(o.name)}</option>`).join("")}</select>`;
const locs = () => S.clinic.locations;

async function rawFetch(method, path, body) {
  const res = await fetch(path, { method, headers: {"Content-Type": "application/json"},
                                  body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && S.auth) showLogin("Your session has ended. Please log in again; your work is kept.");
  if (!res.ok) { const err = new Error(data.error || res.statusText); err.status = res.status; throw err; }
  return data;
}

// ---------- password protection (see clinic/auth.py) ----------
function showLogin(message, notConfigured) {
  $("#login").hidden = false;
  $("#login-form").hidden = !!notConfigured; $("#login-setup").hidden = !notConfigured;
  if (message) $("#login-msg").textContent = message;
  if (!notConfigured) setTimeout(() => $("#login-pw").focus(), 0);
}
$("#login-form").onsubmit = async e => {
  e.preventDefault();
  const btn = $("#login-form .btn"); btn.disabled = true; $("#login-err").textContent = "";
  try {
    const res = await fetch("/api/login", { method: "POST", headers: {"Content-Type": "application/json"},
                                            body: JSON.stringify({ password: $("#login-pw").value }) });
    const d = await res.json().catch(() => ({}));

$("#logout").onclick = async () => {

// Two modes. Normal: the local server holds the data in memory and writes files when you Save.
// Stateless (the Vercel deployment): the server keeps nothing, so the browser holds the working data
// (S.state, also kept in localStorage), sends it with every call, and takes the new data back.
// Save then downloads the changed files for you to commit.
const STORE_KEY = "clinic-planner-state-v1";
async function api(method, path, body) {
  if (!S.stateless) return rawFetch(method, path, body);
  const [p, qs = ""] = path.split("?"), query = {};
  new URLSearchParams(qs).forEach((v, k) => (query[k] ||= []).push(v));
  const env = await rawFetch("POST", "/api/call", { method, path: p, query, body: body ?? null, state: S.state });
  if (env.status >= 400) { const err = new Error(env.result?.error || "Request failed"); err.status = env.status; throw err; }
  if (env.state) { S.state = env.state; persistState(); }
  return env.result;
}
let storageWarned = false;
function persistState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S.state)); }
  catch (e) { if (!storageWarned) { storageWarned = true; banner("warn", "This browser won't keep your work between visits (storage is full or blocked). Use Save… to download the files."); } }
}
function downloadFiles(files) {   // one download per changed file (spaced out so browsers allow them all)
  Object.entries(files).forEach(([name, text], i) => setTimeout(() => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "application/json" })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }, i * 400));
}
const toDisk = () => S.stateless ? "download the files" : "write to disk";
async function initStatelessState() {
  const deployed = await rawFetch("GET", "/api/initial");   // the data shipped with this deployment
  const fresh = () => ({ version: 1, groups: deployed.groups, base: deployed.groups, rawHash: deployed.hashes });
  let stored = null; try { stored = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
  S.state = stored && stored.version === 1 && stored.groups && stored.base ? stored : fresh();
  try { await api("GET", "/api/status"); }   // does the stored data still load?
  catch (e) {
    if (S.state === stored && confirm(`The data saved in this browser couldn't be loaded (${e.message}).\n\nStart again from the deployed data? Your browser copy will be discarded.`)) {
      S.state = fresh(); persistState();
    } else throw e;
  }
}

// ---------- saving: nothing is written to disk without an explicit confirmation ----------
function renderSavebar() {
  const u = S.unsaved, ex = S.external, bar = $("#savebar");
  const files = u.map(x => `${x.file} (+${x.added} −${x.removed})`).join(", ");
  const st = S.stateless;
  bar.innerHTML =
    (ex.length ? `<span class="state ext" title="${st ? "A newer version of the data has been deployed since you loaded it. Reload to pick it up." : "These files were changed outside the app (e.g. git pull). Reload to pick them up."}">⚠ ${st ? "Newer data deployed" : "Changed on disk"}: ${esc(ex.join(", "))}</span>` : "") +
    (u.length ? `<span class="state dirty" title="${st ? "Held in this browser only. Use Save… to download the files." : "Held in memory only. Not written to disk yet."}">● Unsaved: ${esc(files)}</span>
                 <button class="btn" id="sv-save">${st ? "Save (download)…" : "Save…"}</button><button class="btn secondary" id="sv-discard">Discard</button>`
              : `<span class="state clean">✓ Nothing to save</span>`) +
    (ex.length && (st || !u.length) ? `<button class="btn secondary" id="sv-reload">${st ? "Reload deployed data" : "Reload from disk"}</button>` : "");
  const save = $("#sv-save"), discard = $("#sv-discard"), reload = $("#sv-reload");
  if (save) save.onclick = () => guard(() => saveToDisk());
  if (discard) discard.onclick = () => guard(async () => {
    if (!confirm(st ? "Discard all unsaved changes and go back to the last saved (downloaded) state?\n\nThis cannot be undone."
                    : "Discard all unsaved changes and reload everything from disk?\n\nThis cannot be undone.")) return;
    applyClinic(await api("POST", "/api/discard", {}));
    banner("ok", st ? "Changes discarded." : "Reloaded from disk.", 3000); render();
  });
  if (reload) reload.onclick = () => guard(async () => {
    if (!confirm(st ? "Replace your working data with the data currently deployed?\n\nUnsaved changes in this browser will be lost."
                    : u.length ? "Discard all unsaved changes and reload everything from disk?\n\nThis cannot be undone." : "Reload everything from disk?")) return;
    applyClinic(await api("POST", "/api/discard", { to: "deployed" }));
    banner("ok", st ? "Loaded the deployed data." : "Reloaded from disk.", 3000); render();
  });
}
async function saveToDisk() {
  const u = S.unsaved; if (!u.length) return;
  const list = u.map(x => `  • ${x.file}  (+${x.added} / −${x.removed} lines${x.new ? ", new file" : ""})`).join("\n");
  const st = S.stateless;
  if (!confirm(st ? `Download these changed files?\n\n${list}\n\nThis site can't write to your repository. Put the downloaded files in clinic_data/ and commit them to keep the changes (they also stay in this browser). Files not listed are unchanged.`
                  : `Save these changes to disk?\n\n${list}\n\nThis overwrites the files in ${S.dataDir || "the data folder"}/. Files not listed are left alone.`)) return;
  let r;
  try { r = await api("POST", "/api/save", {}); }
  catch (e) {
    if (e.status !== 409) throw e;
    if (!confirm(`${e.message}.\n\n${st ? "Downloading now would replace those newer deployed changes with the version in this browser" : "Saving now would overwrite those outside changes with the version in the app"}.\n\nContinue anyway? (Cancel, then use “${st ? "Reload deployed data" : "Reload from disk"}”, to keep the ${st ? "deployed" : "outside"} changes and lose yours.)`)) return;
    r = await api("POST", "/api/save", { force: true });
  }
  if (st && r.files) downloadFiles(r.files);
  applyClinic(r);
  banner("ok", st ? `Downloaded ${esc(r.saved.join(", ") || "nothing (already up to date)")}. Put ${r.saved.length === 1 ? "it" : "them"} in clinic_data/ and commit to keep the changes.`
                  : `Saved ${esc(r.saved.join(", ") || "nothing (already up to date)")}.`, 6000);
  render();
}

const trainingNeeded = (it, k) => { const need = S.clinic.equipment_needing_training || [];
  return k === "numbing" ? [] : (roomsAt(it.loc).find(r => r.id === it.room)?.equipment || []).filter(e => need.includes(e)); };
const isTrained = (p, tags) => tags.every(e => (p.skills || []).includes(e));

const newItem = from => ({ loc: from?.locChosen ? from.loc : S.location, locChosen: !!from?.locChosen,   // a row follows the timetable's clinic and date until you pick one
  date: from?.dateChosen ? from.date : S.date, dateChosen: !!from?.dateChosen,
  preset: from?.preset || "", name: from?.preset ? from.name : "", numbing: from?.numbing ?? 15, doctor: from?.doctor ?? 30,
  staff: from?.staff ?? 15, room: from?.room || null, doctorId: "", staffIds: {},

const toApiItem = it => ({ location_id: it.loc, date: it.dateChosen ? it.date : undefined, name: it.name, treatment_id: it.preset || null, numbing_minutes: +it.numbing, doctor_minutes: +it.doctor,

async function putListInPanel(l) {

// ---------- a list as a stand-alone file: you choose where it goes on your computer ----------
const listBody = name => ({ name, location_id: S.location, items: S.list.items.map(toApiItem) });
async function saveListFile() {
  const L = S.list, t = S.tt, n = L.items.length;
  if (!n) throw new Error("The list is empty: add a treatment first.");
  if (S.stateless) {   // deployed: the browser's own Save-as dialog (it lets you choose the folder) or a download
    const name = (prompt(`Name for this list (it becomes the file name).\n${n} treatment${n === 1 ? "" : "s"} at ${t.location}:`, S.listName || "") || "").trim();
    return name ? saveListFileInBrowser(name) : undefined;
  }
  // local: a "Save as" dialog: pick the folder anywhere on this computer and type the file name
  const pick = await openPicker({ mode: "save", start: recentDirs()[0] || "", filename: `${S.listName || "Treatment list"}.json`,
                                  title: `Save this list (${n} treatment${n === 1 ? "" : "s"} at ${t.location}) as…` });
  if (!pick) return;
  rememberDir(pick.directory);
  const name = pick.filename.replace(/\.json$/i, "").trim() || "Treatment list";
  const body = { ...listBody(name), directory: pick.directory, filename: pick.filename };
  const info = await api("POST", "/api/list-export", { ...body, dry_run: true });
  if (!confirm(`Save this list as a file?\n\n  ${info.path}\n\n${n} treatment${n === 1 ? "" : "s"} at ${t.location}: times, rooms, names, clients (not the bookings).\n` +
      `${info.exists ? "\nA file with this name ALREADY EXISTS there and will be REPLACED.\n" : ""}${info.directory_exists ? "" : "\nThe folder doesn't exist yet and will be created.\n"}\nNothing else is changed.`)) return;
  const r = await api("POST", "/api/list-export", { ...body, overwrite: info.exists });
  S.listName = name; banner("ok", `Saved the list to ${esc(r.path)}.`, 6000);
}
async function saveListFileInBrowser(name) {   // deployed: the browser's own "Save as" dialog, or a download
  const r = await api("POST", "/api/list-file", listBody(name));
  if (typeof window.showSaveFilePicker === "function") {
    let h; try { h = await window.showSaveFilePicker({ suggestedName: r.filename, types: [{ description: "Treatment list", accept: { "application/json": [".json"] } }] }); }
    catch (e) { if (e.name === "AbortError") return; throw e; }
    const w = await h.createWritable(); await w.write(r.text); await w.close();
    banner("ok", `Saved the list as “${esc(h.name)}”.`, 6000);
  } else {
    downloadFiles({ [r.filename]: r.text });
    banner("ok", `Downloaded ${esc(r.filename)}. Your browser decides where downloads go (it can be set to ask each time).`, 7000);
  }
  S.listName = name;
}
function pickJsonFile() {
  return new Promise(resolve => {
    const input = document.createElement("input"); input.type = "file"; input.accept = ".json,application/json";
    input.onchange = () => resolve(input.files[0] || null); input.oncancel = () => resolve(null); input.click();
  });
}
async function loadListFile() {
  let r, label;
  if (S.stateless) {   // deployed: the computer's own file dialog (the server can't see your folders)
    const f = await pickJsonFile(); if (!f) return;
    let data; try { data = JSON.parse(await f.text()); } catch (e) { throw new Error(`${f.name} isn't valid JSON: ${e.message}`); }
    if (!data || data.kind !== "clinic-treatment-list" || !Array.isArray(data.items)) throw new Error(`${f.name} isn't a treatment list file (the kind made by “Save to file…”).`);
    r = await api("POST", "/api/list-file", { name: data.name || f.name.replace(/\.json$/i, ""), location_id: data.location_id, items: data.items, lenient: true });
    label = f.name;
  } else {             // local: an "Open" dialog: browse to any folder on this computer and pick the file
    const path = await openPicker({ mode: "open", start: recentDirs()[0] || "", title: "Open a treatment list file" });
    if (!path) return;
    r = await api("POST", "/api/list-open", { path });
    rememberDir(r.directory); label = r.filename;
  }
  const L = S.list, count = r.items.length;
  if (L.items.some(i => i.status === "booked" || i.touched) &&
      !confirm(`Replace the list in this panel with “${r.name}” from ${label} (${count} treatment${count === 1 ? "" : "s"})?\n\nBookings already made stay in the schedule; only the list here is replaced.`)) return;
  await putListInPanel({ name: r.name, location_id: r.location_id, items: r.items });
  const where = [...new Set(r.items.map(i => clinicName(i.location_id)))].join(" + ");
  banner(r.warnings.length ? "warn" : "ok", `Loaded “${esc(r.name)}” from ${esc(label)}${where ? ` (${esc(where)})` : ""}.` +
    (r.warnings.length ? `<ul>${r.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul>` : " Press Book next to start."), r.warnings.length ? 0 : 4000);
}
// name (or clear) who does a step of an existing booking; the server enforces the staff rules
async function assignStaff(bookingId, step, staffId) {
  const keep = $("#book-panel")?.scrollTop || 0;
  try {
    const r = await api("PUT", `/api/bookings/${bookingId}/staff`, { staff: { [step]: staffId || null } });
    const it = S.list.items.find(i => i.booking?.id === bookingId); if (it) it.booking = r.booking;
    await loadClinic(); await viewTimetable();
    const panel = $("#book-panel"); if (panel) panel.scrollTop = keep;
  } catch (e) {
    fail(e); if (S.tab === "timetable") drawBookingPanel(); else await render();   // put the select back
  }
}
async function assignStaffRoster(bookingId, step, staffId) {
  try { await api("PUT", `/api/bookings/${bookingId}/staff`, { staff: { [step]: staffId || null } }); await loadClinic(); await viewRoster(); }
  catch (e) { fail(e); await viewRoster(); }
}
async function cancelBooked(i) {
  const it = S.list.items[i];
  await api("DELETE", `/api/bookings/${it.booking.id}`);
  if (S.list.last === it.booking.id) S.list.last = null;
  it.status = "pending"; it.booking = null; S.list.summary = ""; S.list.scrollNext = true;
  await loadClinic(); await viewTimetable();
}
async function runBooking(mode) {   // "next" | "all" | "check" (dry run)
  const L = S.list, idx = L.items.map((_, i) => i).filter(i => L.items[i].status !== "booked");
  if (!idx.length) return;
  const use = mode === "next" ? idx.slice(0, 1) : idx;
  const r = await api("POST", "/api/book-list", { location_id: S.location, date: S.date, dry_run: mode === "check",
    items: use.map(i => { const it = L.items[i];
      return { name: it.name, numbing_minutes: +it.numbing, doctor_minutes: +it.doctor, staff_minutes: +it.staff, room_id: it.room,
               doctor_id: it.doctorId || undefined, treatment_id: it.preset || undefined, staff: staffPayload(it), start: it.start, client: it.client,
               location_id: it.loc, date: it.date }; }) });
  r.results.forEach((x, k) => { const it = L.items[use[k]]; it.reasons = []; it.preview = null; it.note = "";
    if (mode === "check") it.preview = { status: x.status, reasons: x.reasons || [], booking: x.booking };
    else if (x.status === "booked") { it.status = "booked"; it.booking = x.booking; L.last = x.booking.id; }
    else if (x.status === "failed") { it.status = "failed"; it.reasons = x.reasons; }
    else it.note = "Not attempted: an earlier treatment in the list could not be carried out."; });
  const n = r.total, verb = mode === "check" ? "can be carried out" : "booked", f = r.stopped_at;
  L.summary = mode === "next" ? "" : f === null ? `<span class="pill yes">All ${n} ${verb}</span>`
    : `<span class="pill no">${r.booked} of ${n} ${verb}</span> Stopped at <b>${use[f] + 1}</b>: it cannot be performed.` + (n - f - 1 ? ` ${n - f - 1} after it not attempted.` : "");
  L.scrollNext = true;
  if (mode === "check") drawBookingPanel();
  else { await loadClinic(); await viewTimetable(); }
}

// ---------- edit availability (drag on timetable rows) ----------
function setupEditing(lo, n) {
  const tt = $(".tt"), colW = () => tt.querySelector(".tt-hour").getBoundingClientRect().width;   // the cells stretch to the window
  const rowOf = () => tt.querySelector(`.tt-row[data-kind="${S.sel.kind}"][data-id="${S.sel.id}"]`);
  const slotAt = (row, x) => lo + Math.max(0, Math.min(n - 1, Math.floor((x - row.getBoundingClientRect().left - LABEL) / colW())));
  const range = () => [Math.min(S.sel.a, S.sel.b), Math.max(S.sel.a, S.sel.b)];
  function drawSel() {
    tt.querySelectorAll(".sel").forEach(el => el.remove());
    if (!S.sel) return;
    const [a, b] = range(), el = document.createElement("div");
    el.className = "sel"; const COL = colW(); el.style.left = (LABEL + (a - lo) * COL) + "px"; el.style.width = ((b - a + 1) * COL - 1) + "px";
    rowOf().appendChild(el);
  }
  tt.onpointerdown = e => {
    const row = e.target.closest(".tt-row[data-kind]");
    if (!row || e.clientX - row.getBoundingClientRect().left < LABEL) return;
    e.preventDefault();
    const a = slotAt(row, e.clientX);
    S.sel = { kind: row.dataset.kind, id: row.dataset.id, a, b: a, dragging: true };
    drawSel(); renderEditBar();
  };
  window.onpointermove = e => { if (S.sel?.dragging) { S.sel.b = slotAt(rowOf(), e.clientX); drawSel(); } };
  window.onpointerup = () => { if (S.sel?.dragging) { S.sel.dragging = false; renderEditBar(); } };
  renderEditBar();
}
function renderEditBar() {
  const bar = $("#editbar"), sel = S.sel, t = S.tt;
  if (!sel) { bar.innerHTML = `<b>Edit availability</b><div class="muted">Drag across a doctor, staff or room row to select a time range (each cell = 15 min), then choose what to do. Nothing changes until you press a button.</div>`; return; }
  const [a, b] = [Math.min(sel.a, sel.b), Math.max(sel.a, sel.b)], start = slotStr(a), end = slotStr(b + 1);
  const list = t[{doctor: "doctors", staff: "staff", room: "rooms"}[sel.kind]], name = list.find(r => r.id === sel.id).name;
  const room = sel.kind === "room", what = room ? "room" : "time";
  bar.innerHTML = `<b>${esc(name)}</b> · ${start}–${end} on ${esc(S.date)}
    <div class="row" style="margin:10px 0 0">
      <button class="btn danger" data-act="false">Block ${what} (unavailable)</button>
      <button class="btn" data-act="true">Unblock (available)</button>
      <label>Repeat weekly until (optional) <input type="date" id="rep" min="${S.date}"></label>
      <button class="btn secondary" data-cancel="1">Clear selection</button>
    </div>
    <div class="muted" style="margin-top:8px">${room
      ? "Blocked rooms can't be booked (e.g. maintenance)."
      : "Doctors and staff who are ticked in are free all day unless booked or blocked. Block a time for lunch, leave, etc. (use the tick box for which location they are in)."}
      Existing bookings are kept but flagged. Repeat applies to the same weekday each week.</div>`;
  bar.onclick = e => {
    if (e.target.dataset.cancel) { S.sel = null; $("#main").querySelectorAll(".sel").forEach(x => x.remove()); renderEditBar(); return; }
    const act = e.target.dataset.act; if (act === undefined) return;
    guard(async () => {
      const r = await api("PUT", "/api/availability", { kind: sel.kind, id: sel.id, date: S.date,
        start, end, available: act === "true", repeat_until: $("#rep").value || undefined });
      await loadClinic(); await viewTimetable();
      if (!S.issues.length) banner("ok", `${esc(name)} ${start}–${end} updated${r.days > 1 ? ` for ${r.days} weeks` : ""}.`, 3000);

// ---------- staff training: who may work with which equipment ----------
async function viewTraining() {
  const staff = S.clinic.staff, needs = new Set(S.clinic.equipment_needing_training || []);
  const tags = new Map();   // equipment tag -> rooms that have it
  for (const l of locs()) for (const r of l.rooms || []) for (const e of r.equipment || []) (tags.get(e) || tags.set(e, []).get(e)).push(r.name.toUpperCase() === toolName(e) ? l.name : `${r.name} (${l.name})`);
  for (const e of needs) if (!tags.has(e)) tags.set(e, []);
  for (const p of staff) for (const e of p.skills || []) if (!tags.has(e)) tags.set(e, []);
  const cols = [...tags.keys()].sort((a, b) => (needs.has(b) - needs.has(a)) || a.localeCompare(b));
  const trained = e => staff.filter(p => (p.skills || []).includes(e));
  const summary = cols.filter(e => needs.has(e)).map(e => { const who = trained(e);
    return `<li><b>${esc(toolName(e))}</b> <span class="muted">· ${esc((tags.get(e) || []).join(", ") || "no room has it")}</span> · trained: ${who.length ? esc(who.map(p => p.name).join(", ")) : "<b style='color:var(--bad)'>nobody, so the doctor and staff steps in these rooms can't be staffed</b>"}</li>`; }).join("");
  const cell = (p, e) => { const has = (p.skills || []).includes(e);
    return `<td class="${needs.has(e) ? (has ? "t-yes" : "t-no") : (has ? "t-spare" : "")}"><input type="checkbox" data-skill="${esc(p.id)}" data-tag="${esc(e)}" ${has ? "checked" : ""} title="${esc(p.name)} ${has ? "is" : "is not"} trained on ${esc(toolName(e))}"></td>`; };
  $("#main").innerHTML = `<div class="card"><h3>Staff training</h3>
      <div class="muted" style="margin-bottom:10px">Some equipment may only be used with trained staff. Tick <b>needs training</b> for such equipment, then tick who is trained on it. In a room with that equipment, the doctor-treatment and staff-treatment steps need a trained person (numbing doesn't); a booking is refused when none is free. Changes are kept in memory until you <b>Save…</b> (top bar); they are written to <code>resources.json</code>.</div>
      ${cols.length ? `<div style="overflow-x:auto"><table class="training"><tr><th></th>${cols.map(e => `<th>${esc(toolName(e))}<small>${esc((tags.get(e) || []).join(", ") || "no room has it")}</small></th>`).join("")}</tr>
        <tr class="need-row"><td>Needs training</td>${cols.map(e => `<td><input type="checkbox" data-need="${esc(e)}" ${needs.has(e) ? "checked" : ""} title="Only trained staff may work with ${esc(toolName(e))}"></td>`).join("")}</tr>
        ${staff.map(p => `<tr><td>${esc(p.name)}</td>${cols.map(e => cell(p, e)).join("")}</tr>`).join("")}</table></div>
        <div class="muted" style="margin-top:8px"><span class="pill yes">green</span> trained, and it is needed · pale green: trained, though nothing requires it yet · hatched: training is needed and they don't have it.</div>`
        : `<div class="muted">No room has any equipment yet. Add equipment to rooms under Setup &amp; save (<code>rooms[].equipment</code> in resources.json).</div>`}
    </div>
    <div class="card"><h3>Who can work with what</h3>${summary ? `<ul style="list-style:none;padding:0;margin:0;display:grid;gap:6px">${summary}</ul>` : `<div class="muted">No equipment needs trained staff, so any staff member can work in any room.</div>`}</div>`;
  $("#main").onchange = e => { const el = e.target;
    if (el.dataset.need !== undefined) {
      const next = new Set(needs); el.checked ? next.add(el.dataset.need) : next.delete(el.dataset.need);
      guard(async () => { await api("PUT", "/api/training", { equipment_needing_training: [...next].sort() }); await loadClinic(); await viewTraining(); });
    } else if (el.dataset.skill !== undefined) {
      const p = byId(S.clinic.staff, el.dataset.skill), next = new Set(p.skills || []); el.checked ? next.add(el.dataset.tag) : next.delete(el.dataset.tag);
      guard(async () => { await api("PUT", "/api/training", { skills: { [p.id]: [...next].sort() } }); await loadClinic(); await viewTraining(); });
    } };
}

// ---------- roster (who is at which location each day) & bookings ----------
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const mondayOf = iso => addDays(iso, -((new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7));
async function viewRoster() {
  const F = S.rosterForm; F.from ||= S.date; F.to ||= S.date;
  S.weekOf = mondayOf(S.weekOf || S.date);
  const [roster, {bookings}] = await Promise.all([api("GET", `/api/roster?start=${S.weekOf}&days=7`), api("GET", `/api/bookings?date=${S.date}`)]);
  const dayKeys = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"], dayShort = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const usualText = p => {   // "Usually Orchard", or for a weekly pattern "Usually Mon Asia Square, Tue Orchard, ..."

    if (!per.length) return p.usual_location_id ? `Usually ${clinicName(p.usual_location_id)}` : "";
    const groups = {}; per.forEach(k => (groups[p.usual_locations[k]] ||= []).push(dayShort[dayKeys.indexOf(k)]));
    return "Usually " + Object.entries(groups).map(([l, d]) => `${clinicName(l)} ${d.join("/")}`).join("; ");
  };
  const everyone = roster.people.map(p => ({...p, key: p.role + ":" + p.id}));

  const rows = role => everyone.filter(p => p.role === role).map(p => `<tr><td>${esc(p.name)}${usualText(p) ? ` <span class="muted">· ${esc(usualText(p))}</span>` : ""}${byId(S.clinic.staff, p.id)?.skills?.length && p.role === "staff" ? ` <span class="muted">· trained: ${esc(byId(S.clinic.staff, p.id).skills.map(x => x.toUpperCase()).join(", "))}</span>` : ""}</td>${roster.dates.map((_, i) => cell(p, i)).join("")}</tr>`).join("");
  $("#main").innerHTML = `
    <div class="card"><h3>Roster · week of ${esc(roster.dates[0])}</h3>
      <div class="row"><button class="btn secondary" data-week="-7">← Previous week</button>
        <button class="btn secondary" data-week="0">Week of selected date</button>

      <table class="roster"><tr><th></th>${roster.dates.map((d, i) => `<th>${dayNames[i]} ${d.slice(8)}</th>`).join("")}</tr>
        <tr class="group"><td colspan="8">Doctors</td></tr>${rows("doctor") || `<tr><td colspan="8" class="muted">none</td></tr>`}
        <tr class="group"><td colspan="8">Staff</td></tr>${rows("staff") || `<tr><td colspan="8" class="muted">none</td></tr>`}</table>
      <div class="muted" style="margin-top:8px">Pick the one location each person is at that day, or “—” if they are not in any location. Anyone in a location is free all day there unless booked or blocked. The same thing is the tick box on the Timetable tab. People with a usual location are there automatically on the days it is open; changing a day here makes it an exception (outlined in orange), and picking their usual location again removes the exception.</div>
    </div>

      <div class="row">

  };
}

  document.querySelectorAll("[data-save-hours]").forEach(btn => btn.onclick = () => guard(async () => {
    const box = btn.closest("[data-hours]"), hours = {};
    S.weekdays.forEach(d => { hours[d] = $(`.open[data-d=${d}]`, box).checked
      ? [$(`select[data-d=${d}][data-k=o]`, box).value, $(`select[data-d=${d}][data-k=c]`, box).value] : null; });
    applyClinic(await api("PUT", `/api/locations/${btn.dataset.saveHours}/hours`, { hours }));
    fillJson(); showIssues();
    if (!S.issues.length) banner("ok", `Opening hours updated. Press Save… (top bar) to ${toDisk()}.`, 3000);
  }));
  $("#j-save").onclick = () => guard(async () => {
    let data; try { data = JSON.parse($("#json").value); } catch (e) { throw new Error("Not valid JSON: " + e.message); }
    applyClinic(await api("PUT", "/api/clinic", { [S.setupGroup]: data }));
    await loadClinic(); fillJson(); showIssues();
    if (!S.issues.length) banner("ok", `${GROUPS[S.setupGroup][1]} applied. Press Save… (top bar) to ${toDisk()}.`, 3000);
  });
  $("#j-reload").onclick = () => guard(async () => { await loadClinic(); fillJson(); });
  $("#j-down").onclick = () => { const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([$("#json").value + "\n"], {type: "application/json"}));
    a.download = GROUPS[S.setupGroup][1]; a.click(); };
  $("#j-up").onchange = async e => { const f = e.target.files[0]; if (f) $("#json").value = await f.text(); };
  if ($("#dir-browse")) $("#dir-browse").onclick = () => guard(async () => {
    const chosen = await openDirPicker($("#dir-path").value); if (chosen) $("#dir-path").value = chosen;
  });
  $("#dir-save").onclick = () => guard(S.stateless ? saveToFolder : saveToDirectory);
  $("#dir-load").onclick = () => guard(S.stateless ? loadFromFolder : loadFromDirectory);
}

// ---------- save a copy to / load from a directory ----------
const FILE_NOTE = "resources.json, planning.json and schedule.json (not the list of treatments)";
const GROUP_FILE_NAMES = { resources: "resources.json", planning: "planning.json", schedule: "schedule.json" };
const DIR_KEY = "clinic-planner-dirs";
const recentDirs = () => { try { return JSON.parse(localStorage.getItem(DIR_KEY)) || []; } catch (e) { return []; } };
const rememberDir = d => { try { localStorage.setItem(DIR_KEY, JSON.stringify([d, ...recentDirs().filter(x => x !== d)].slice(0, 8))); } catch (e) {} };
const countsText = c => `${c.locations} location(s), ${c.rooms} room(s), ${c.doctors} doctor(s), ${c.staff} staff, ${c.treatments} template(s), ${c.bookings} booking(s)`;
const countsOfGroups = g => ({ locations: g.resources.locations.length, rooms: g.resources.locations.reduce((n, l) => n + (l.rooms || []).length, 0),
  doctors: g.resources.doctors.length, staff: g.resources.staff.length, treatments: (g.planning.treatments || []).length, bookings: (g.schedule.bookings || []).length });
const replaceWarning = () => S.unsaved.length ? `\n\nYour unsaved changes in ${S.unsaved.map(u => u.file).join(", ")} will be replaced.` : "";

// local server: the typed directory is read / written by the server (it runs on this computer)
function typedDirectory() {
  const dir = $("#dir-path").value.trim();
  if (!dir) throw new Error("Enter a directory, or press Browse… to choose one.");
  return dir;
}

// The chooser dialog: the server (which runs on this computer) lists folders and .json files.
//   mode "folder": choose a folder             -> resolves with its path
//   mode "save":   "Save as" (folder + name)   -> { directory, filename }
//   mode "open":   pick an existing .json file -> its path
// Resolves with null if cancelled.
function openPicker({ mode = "folder", start = "", filename = "", title = "" } = {}) {
  return new Promise(resolve => {
    const el = $("#dirpick"), list = $("#dp-list"), withFiles = mode !== "folder";
    let here = null, hidden = false, selected = null;
    const finish = value => { el.hidden = true; document.removeEventListener("keydown", onKey); resolve(value); };
    const onKey = e => { if (e.key === "Escape") finish(null); };
    const kb = n => n < 1024 ? `${n} B` : `${Math.round(n / 1024)} KB`;
    const accept = () => {
      if (!here) return;
      if (mode === "folder") return finish(here.path);
      if (mode === "save") { const name = $("#dp-filename").value.trim(); if (!name) { $("#dp-note").textContent = "Type a file name."; return; } return finish({ directory: here.path, filename: name }); }
      if (!selected) { $("#dp-note").textContent = "Click a file to select it first."; return; }
      finish(selected);
    };
    async function go(path) {
      try {
        const d = await api("GET", `/api/browse?path=${encodeURIComponent(path || "")}${hidden ? "&hidden=1" : ""}${withFiles ? "&files=1" : ""}`);
        here = d.current; selected = null;
        const missing = d.requested_missing;
        $("#dp-input").value = here.path; $("#dp-up").disabled = !here.parent;
        $("#dp-shortcuts").innerHTML = d.shortcuts.map(x => `<button class="btn secondary" data-go="${esc(x.path)}" title="${esc(x.path)}">${esc(x.label)}</button>`).join("");
        $("#dp-note").textContent = missing ? `“${missing}” doesn't exist yet. Showing the nearest folder that does.`
          : mode === "folder" ? (here.files.length ? `This folder has ${here.files.join(", ")}.` : "No clinic files in this folder.")
          : mode === "save" ? (d.files.length ? "The .json files already here are listed; click one to replace it." : "No .json files in this folder yet.")
          : (d.files.length ? "Click a treatment list file, then Open (or double-click it)." : "No .json files in this folder.");
        $("#dp-note").style.color = missing ? "var(--bad)" : "";
        $("#dp-ok").textContent = mode === "save" ? "Save here" : mode === "open" ? "Open" : "Choose this folder";
        const files = d.files.map(f => `<button class="dp-item file ${f.list || mode === "save" ? "" : "dim"}" data-file="${esc(f.path)}" data-name="${esc(f.name)}">📄 ${esc(f.name)}${f.list ? `<span class="tag">treatment list</span>` : ""}<span class="size">${kb(f.size)}</span></button>`).join("");
        list.innerHTML = (missing && mode === "folder" ? `<button class="dp-item new" data-pick="${esc(missing)}">＋ Use “${esc(missing)}” (will be created when you save)</button>` : "") +
          d.entries.map(x => `<button class="dp-item" data-go="${esc(x.path)}">📁 ${esc(x.name)}${x.clinic ? `<span class="tag">clinic data</span>` : ""}</button>`).join("") + files +
          (!d.entries.length && !d.files.length ? `<div class="muted" style="padding:12px">${withFiles ? "No sub-folders or .json files here." : "No sub-folders here."}</div>` : "") +
          (d.truncated ? `<div class="muted" style="padding:8px 10px">Only the first ${d.entries.length} folders / files are shown; type a path above to go further.</div>` : "");
        list.scrollTop = 0;
      } catch (e) { fail(e); }
    }
    const openedAt = Date.now();   // a quick double-click on the button that opened us must not count as a click on the backdrop
    el.onclick = e => { if (e.target === el && Date.now() - openedAt > 500) finish(null); };
    $("#dp-shortcuts").onclick = list.onclick = e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.pick) finish(b.dataset.pick);
      else if (b.dataset.go) go(b.dataset.go);
      else if (b.dataset.file) {
        if (mode === "save") $("#dp-filename").value = b.dataset.name;
        else { selected = b.dataset.file; list.querySelectorAll(".dp-item.picked").forEach(x => x.classList.remove("picked")); b.classList.add("picked"); $("#dp-note").textContent = `Selected: ${b.dataset.name}`; $("#dp-note").style.color = ""; }
      }
    };
    list.ondblclick = () => { if (mode === "open" && selected) accept(); };   // the first click already selected the file
    $("#dp-up").onclick = () => here?.parent && go(here.parent);
    $("#dp-input").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); go($("#dp-input").value); } };
    $("#dp-filename").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); accept(); } };
    $("#dp-hidden").onchange = e => { hidden = e.target.checked; go(here?.path); };
    $("#dp-cancel").onclick = () => finish(null);
    $("#dp-ok").onclick = accept;
    $("#dp-new").onclick = () => guard(async () => {
      const name = prompt(`Name for the new folder inside\n${here.path}`); if (!name || !name.trim()) return;
      const r = await api("POST", "/api/mkdir", { path: here.path, name }); await go(r.path);
    });
    $("#dp-title").textContent = title || (mode === "save" ? "Save as…" : mode === "open" ? "Open a file" : "Choose a directory");
    $("#dp-filerow").hidden = mode !== "save"; $("#dp-filename").value = filename;
    $("#dp-hidden").checked = false; el.hidden = false; document.addEventListener("keydown", onKey);
    window.getSelection()?.removeAllRanges();     // no stray page-text highlight left over from clicking the button
    $("#dp-input").value = ""; $("#dp-note").textContent = ""; $("#dp-shortcuts").innerHTML = "";      // don't flash the last visit's folder
    list.innerHTML = `<div class="muted" style="padding:12px">Loading…</div>`;
    go(start);
    if (mode === "save") setTimeout(() => { $("#dp-filename").focus(); $("#dp-filename").select(); }, 0);
  });
}
const openDirPicker = start => openPicker({ mode: "folder", start });

async function saveToDirectory(dirArg) {
  const dir = dirArg ?? typedDirectory();
  const info = await api("POST", "/api/export", { directory: dir, dry_run: true });
  const lines = info.files.map(f => `  • ${f.name}: ${!f.exists ? "new file" : f.identical ? "already identical (left as it is)" : "will be OVERWRITTEN"}`).join("\n");
  if (!confirm(`Save a copy of the clinic data to:\n  ${info.directory}\n\n${lines}\n\n${info.exists ? "" : "The directory doesn't exist yet and will be created.\n\n"}This saves the current working data, unsaved changes included. It only makes a copy: the data folder and your unsaved-changes state are not affected.`)) return;
  const r = await api("POST", "/api/export", { directory: dir });
  rememberDir(dir);
  banner("ok", r.written.length ? `Saved ${esc(r.written.join(", "))} to ${esc(r.directory)}.` : `${esc(r.directory)} already had identical files; nothing was written.`, 6000);
}
async function loadFromDirectory() {
  const dir = typedDirectory();
  const info = await api("POST", "/api/import", { directory: dir, dry_run: true });
  if (!confirm(`Load the clinic data from:\n  ${info.directory}\n\nThis replaces the working data.\n  now:    ${countsText(info.current)}\n  loaded: ${countsText(info.summary)}${replaceWarning()}\n\nNothing is written to the data folder until you press Save… in the top bar (Discard goes back).`)) return;
  applyClinic(await api("POST", "/api/import", { directory: dir }));
  rememberDir(dir); banner("ok", `Loaded the clinic data from ${esc(info.directory)}. Press Save… (top bar) to keep it in the data folder.`, 6000);
  render();
}

// deployed (stateless) mode: the server can't see your computer, so use a folder you pick in the browser
const canPickFolder = () => typeof window.showDirectoryPicker === "function";
async function saveToFolder() {
  const files = (await api("GET", "/api/files")).files;
  if (!canPickFolder()) {
    if (!confirm(`This browser can't save into a folder directly.\n\nDownload ${FILE_NOTE} instead?`)) return;
    downloadFiles(files); banner("ok", "Downloaded the three files.", 5000); return;
  }
  let dir;
  try { dir = await window.showDirectoryPicker({ mode: "readwrite" }); } catch (e) { if (e.name === "AbortError") return; throw e; }
  const existing = {};
  for (const name of Object.keys(files)) { try { existing[name] = await (await (await dir.getFileHandle(name)).getFile()).text(); } catch (e) { existing[name] = null; } }
  const lines = Object.keys(files).map(n => `  • ${n}: ${existing[n] === null ? "new file" : existing[n] === files[n] ? "already identical (left as it is)" : "will be OVERWRITTEN"}`).join("\n");
  if (!confirm(`Save a copy of the clinic data into the folder “${dir.name}”?\n\n${lines}\n\nThis saves the current working data, unsaved changes included. It only makes a copy: your working data and unsaved-changes state are not affected.`)) return;
  const written = [];
  for (const [name, text] of Object.entries(files)) {
    if (existing[name] === text) continue;
    const w = await (await dir.getFileHandle(name, { create: true })).createWritable(); await w.write(text); await w.close(); written.push(name);
  }
  banner("ok", written.length ? `Saved ${esc(written.join(", "))} into “${esc(dir.name)}”.` : `“${esc(dir.name)}” already had identical files; nothing was written.`, 6000);
}
function pickFolderFiles() {   // browsers without the folder API: pick a folder through a file input
  return new Promise(resolve => {
    const input = document.createElement("input"); input.type = "file"; input.webkitdirectory = true; input.multiple = true;
    input.onchange = async () => {
      const out = {}, names = Object.values(GROUP_FILE_NAMES);
      for (const f of input.files) if (names.includes(f.name) && (f.webkitRelativePath || f.name).split("/").length <= 2) out[f.name] = await f.text();
      resolve({ name: (input.files[0]?.webkitRelativePath || "").split("/")[0] || "the folder", texts: out });
    };
    input.oncancel = () => resolve(null);
    input.click();
  });
}
async function loadFromFolder() {
  let folder;
  if (canPickFolder()) {
    let dir; try { dir = await window.showDirectoryPicker({ mode: "read" }); } catch (e) { if (e.name === "AbortError") return; throw e; }
    const texts = {};
    for (const name of Object.values(GROUP_FILE_NAMES)) { try { texts[name] = await (await (await dir.getFileHandle(name)).getFile()).text(); } catch (e) {} }
    folder = { name: dir.name, texts };
  } else { folder = await pickFolderFiles(); if (!folder) return; }
  const missing = Object.values(GROUP_FILE_NAMES).filter(n => folder.texts[n] === undefined);
  if (missing.length) throw new Error(`“${folder.name}” is missing ${missing.join(", ")} (a clinic folder holds resources.json, planning.json and schedule.json).`);
  const groups = {};
  for (const [g, name] of Object.entries(GROUP_FILE_NAMES)) {
    try { groups[g] = JSON.parse(folder.texts[name]); } catch (e) { throw new Error(`${name} in “${folder.name}” isn't valid JSON: ${e.message}`); }
  }
  let loaded; try { loaded = countsOfGroups(groups); } catch (e) { throw new Error(`“${folder.name}” doesn't look like clinic data: resources.json should be an object with locations, doctors and staff.`); }
  const now = countsOfGroups(S.groups);
  if (!confirm(`Load the clinic data from the folder “${folder.name}”?\n\nThis replaces the working data.\n  now:    ${countsText(now)}\n  loaded: ${countsText(loaded)}${replaceWarning()}\n\nYour files are not changed. Use Save (download) afterwards to keep the result; Discard goes back.`)) return;
  applyClinic(await api("PUT", "/api/clinic", groups));
  banner("ok", `Loaded the clinic data from “${esc(folder.name)}”.`, 6000);
  render();
}

// ---------- boot ----------
(async () => {
  const d = new Date(); S.date = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  let ready = false;
  await guard(async () => {
    const mode = await fetch("/api/mode").then(r => r.ok ? r.json() : { mode: "server" }).catch(() => ({ mode: "server" }));
    S.stateless = mode.mode === "stateless"; S.auth = !!mode.auth;
    if (mode.misconfigured) return showLogin(null, true);                 // required password isn't set: show nothing
    if (S.auth && !mode.authenticated) return showLogin();                // nothing is requested until logged in
    $("#logout").hidden = !S.auth;
    if (S.stateless) await initStatelessState();
    await loadClinic();
    ready = true;
  });
  if (ready) render();
})();
</script>
