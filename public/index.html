<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Planner</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6a7385; --line: #dfe3ea;
    --accent: #2f6fed; --accent-text: #fff;
    --free: #cfeedd; --free-line: #a7dcc0; --off: #eceef2; --closed: #d9dce3;
    --away: #fde7b8; --away-text: #7a5300; --blocked: #f3b8b2; --booked: #2f6fed; --booked-text: #fff;
    --bad: #b3261e; --bad-bg: #fde8e6; --ok: #1b7a43; --ok-bg: #e3f5ea; --warn-bg: #fff4d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --panel: #1c2028; --text: #e6e9ef; --muted: #98a1b3; --line: #30363f;
      --accent: #5b8cff; --accent-text: #0b1020;
      --free: #1f4a35; --free-line: #2a6a4b; --off: #232830; --closed: #2c313a;
      --away: #5a4515; --away-text: #f7dca0; --blocked: #7a3430; --booked: #4a7bf0; --booked-text: #fff;
      --bad: #ff8a80; --bad-bg: #3b1e1c; --ok: #6fd69a; --ok-bg: #173526; --warn-bg: #3a3014;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 12px 20px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0; }
  main { padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { background: none; border: 0; padding: 8px 14px; border-radius: 8px; color: var(--muted);
               font: inherit; cursor: pointer; }
  nav button.on { background: var(--accent); color: var(--accent-text); }
  .spacer { flex: 1; }
  #savebar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  #savebar .state { padding: 3px 10px; border-radius: 99px; font-weight: 600; }
  #savebar .state.clean { background: var(--ok-bg); color: var(--ok); }
  #savebar .state.dirty { background: var(--warn-bg); color: var(--away-text); }
  #savebar .state.ext { background: var(--bad-bg); color: var(--bad); }
  #savebar .btn { padding: 4px 12px; }
  label { color: var(--muted); font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
  input, select, textarea, button { font: inherit; color: var(--text); }
  input, select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  button.btn { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 6px;
               padding: 7px 14px; cursor: pointer; }
  button.btn.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  button.btn.danger { background: var(--bad-bg); color: var(--bad); }
  button.link { background: none; border: 0; color: var(--bad); cursor: pointer; padding: 2px 6px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 8px; font-size: 14px; }
  .muted { color: var(--muted); }
  #banner { padding: 8px 20px; display: none; }
  #banner.warn { display: block; background: var(--warn-bg); }
  #banner.err { display: block; background: var(--bad-bg); color: var(--bad); }
  #banner.ok { display: block; background: var(--ok-bg); color: var(--ok); }
  #banner ul { margin: 4px 0 0 18px; padding: 0; }

  /* timetable grid: one 18px cell per 15 minutes */
  .tt { overflow-x: auto; padding-bottom: 6px; }
  .tt-row { display: grid; align-items: stretch; margin-bottom: 2px; }
  .tt-label input.here { margin: 0 7px 0 0; vertical-align: -2px; cursor: pointer; width: 15px; height: 15px; }
  .tt-label { position: sticky; left: 0; background: var(--panel); z-index: 2; padding: 3px 8px 3px 0;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .tt-label small { color: var(--muted); }
  .tt-hour { font-size: 11px; color: var(--muted); height: 16px; overflow: visible; white-space: nowrap;
             border-left: 1px solid var(--line); padding-left: 2px; }
  .cell { height: 26px; margin-right: 1px; border-radius: 3px; font-size: 10px; overflow: hidden; white-space: nowrap; }
  .cell.free { background: var(--free); border: 1px solid var(--free-line); cursor: pointer; }
  .cell.free:hover { outline: 2px solid var(--accent); }
  .cell.off { background: var(--off); }
  .cell.closed { background: repeating-linear-gradient(45deg, var(--closed), var(--closed) 3px, var(--off) 3px, var(--off) 6px); }
  .cell.blocked { background: repeating-linear-gradient(135deg, var(--blocked), var(--blocked) 3px, transparent 3px, transparent 6px); border: 1px solid var(--blocked); }
  .tt-row { position: relative; }
  .tt.edit .tt-row[data-kind] { cursor: crosshair; touch-action: none; user-select: none; }
  .tt.edit .cell.free:hover { outline: none; }
  .sel { position: absolute; top: -1px; bottom: -1px; z-index: 3; pointer-events: none; border: 2px solid var(--accent);
         background: color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 4px; }
  #editbar b { font-size: 15px; }
  .cell.away { background: var(--away); color: var(--away-text); text-align: center; line-height: 26px; font-weight: 600; }
  .cell.booked { background: var(--booked); color: var(--booked-text); padding: 0 4px; line-height: 26px; cursor: default; }
  .tt h4 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 6px 0 12px; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px;
                         margin-right: 5px; vertical-align: -2px; background: var(--c); }

  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .card table th:first-child:last-of-type, .card tr > th:first-child { white-space: nowrap; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .pill.yes { background: var(--ok-bg); color: var(--ok); }
  .pill.no { background: var(--bad-bg); color: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { background: var(--free); border: 1px solid var(--free-line); border-radius: 6px; padding: 2px 8px;
          cursor: pointer; font-size: 12px; color: var(--text); }
  .reasons { margin: 6px 0 0 18px; padding: 0; color: var(--bad); }
  textarea.json { width: 100%; height: 420px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  .hours td { padding: 3px 8px; }
  .days { display: flex; gap: 8px; }
  table.roster td, table.roster th { padding: 3px 4px; text-align: center; }
  table.roster td:first-child, table.roster th:first-child { text-align: left; white-space: nowrap; }
  table.roster select { padding: 3px 4px; min-width: 96px; }
  table.roster select.set { background: var(--free); border-color: var(--free-line); }
  table.roster tr.group td { background: var(--bg); color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .tt-layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
  .tt-main { min-width: 0; }
  .book-panel { position: sticky; top: 8px; margin-bottom: 0; max-height: calc(100vh - 24px); overflow-y: auto; }
  @media (max-width: 1150px) { .tt-layout { grid-template-columns: 1fr; } .book-panel { position: static; max-height: none; } }
  .bk-head { position: sticky; top: -14px; z-index: 5; background: var(--panel); margin: -14px -14px 10px; padding: 12px 14px;
             border-bottom: 1px solid var(--line); border-radius: 10px 10px 0 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bk-head .btn { padding: 7px 18px; font-weight: 600; }
  .bk-lists { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .bk-lists select { flex: 1; min-width: 120px; }
  .bk-row { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 8px; }
  .bk-row.ok { border-color: var(--free-line); background: color-mix(in srgb, var(--free) 35%, transparent); }
  .bk-row.bad { border-color: var(--bad); }
  .bk-edit { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .bk-edit select, .bk-edit input { flex: 1; min-width: 0; }
  .bk-edit .n { color: var(--muted); width: 18px; }
  .bk-mins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 6px; }
  .bk-mins label, .bk-edit label { font-size: 11px; }
  .bk-mins select { width: 100%; }
  .bk-edit .grow { flex: 1; min-width: 0; }
  .bk-steps { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .bk-step { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 3px; }
  .bk-step select, td select.assign { max-width: 150px; font-size: 12px; padding: 2px 4px; }
  .tt-row.total-row { margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--line); }
  .tt-row.total-row .tt-label { font-weight: 600; }
  .cell.tot { text-align: center; line-height: 26px; font-size: 11px; font-weight: 700; }
  .cell.tot.none { background: transparent; border: 1px dashed var(--line); }
  .cell.tot.ok { background: var(--free); border: 1px solid var(--free-line); }
  .cell.tot.full { background: var(--away); color: var(--away-text); }
  .cell.tot.over { background: var(--bad-bg); color: var(--bad); box-shadow: inset 0 0 0 2px var(--bad); }
  .book-panel .btn { padding: 5px 10px; }
  .cell.booked.latest { box-shadow: 0 0 0 2px var(--away-text); position: relative; z-index: 1; }
  #login { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--bg); padding: 16px; }
  #login[hidden] { display: none; }
  #login form, #login .box { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  #login h2 { margin: 0 0 4px; font-size: 18px; }
  #login input { width: 100%; margin: 12px 0 10px; padding: 9px 10px; font-size: 15px; }
  #login .btn { width: 100%; padding: 9px; }
  #login .err { color: var(--bad); min-height: 1.4em; margin-top: 8px; font-size: 13px; }
  .gtabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .days label { flex-direction: row; align-items: center; gap: 3px; color: var(--text); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Clinic Planner</h1>
  <nav id="nav"></nav>
  <span class="spacer"></span>
  <div id="savebar"></div>
  <button class="btn secondary" id="logout" hidden title="Log out of the app">Log out</button>
  <label>Date <input type="date" id="date"></label>
</header>
<div id="login" hidden>
  <form id="login-form" autocomplete="on">
    <h2>Clinic Planner</h2>
    <div class="muted" id="login-msg">Enter the password to continue.</div>
    <input type="password" id="login-pw" name="password" autocomplete="current-password" placeholder="Password" required>
    <button class="btn" type="submit">Log in</button>
    <div class="err" id="login-err" role="alert"></div>
  </form>
  <div class="box" id="login-setup" hidden><h2>Password not set up</h2>
    <div class="muted">This deployment needs a password before it will show any data. Set <code>CLINIC_PASSWORD</code>
      (Vercel: Project Settings → Environment Variables), then redeploy.</div></div>
</div>
<div id="banner"></div>
<main id="main"></main>

<script>
const TABS = [["timetable", "Timetable"], ["availability", "Availability check"],
              ["roster", "Roster & bookings"], ["setup", "Setup & save"]];
const S = { stateless: false, auth: false, state: null, list: { items: [], last: null, summary: "" }, editAvail: false, sel: null, clinic: null, issues: [], tab: "timetable", date: null, location: null, tt: null,
            avail: { treatment: null, location: "", start: "10:00", results: null, slots: null },
            rosterForm: { who: null, location: "", from: null, to: null, days: [0,1,2,3,4,5,6] }, weekOf: null, setupGroup: "resources" };

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slotStr = i => String(Math.floor(i / 4)).padStart(2, "0") + ":" + String((i % 4) * 15).padStart(2, "0");
const timeOptions = (sel, max = 96) => Array.from({length: max + 1}, (_, i) =>
  `<option value="${slotStr(i)}" ${slotStr(i) === sel ? "selected" : ""}>${slotStr(i)}</option>`).join("");
const byId = (list, id) => list.find(x => x.id === id);
const totalMin = t => t.numbing_minutes + t.doctor_minutes + t.staff_minutes;
// "15 min numbing (1 staff) → 30 min doctor treatment (doctor + 1 staff) → 15 min staff treatment (1 staff)"
const describeSteps = t => t.doctor_minutes === 0
  ? `${t.staff_minutes} min carried out by staff alone (1 staff)`
  : [t.numbing_minutes && `${t.numbing_minutes} min numbing (1 staff)`, `${t.doctor_minutes} min doctor treatment (doctor + 1 staff)`,
     t.staff_minutes && `${t.staff_minutes} min staff treatment (1 staff)`].filter(Boolean).join(" → ");
const STEP_TAG = { numbing: " · numbing", doctor: "", staff: " · staff tx", all: "" };
const STEP_KEYS = ["numbing", "doctor", "staff"];                       // a row's minutes fields are named like the steps
const activeSteps = it => STEP_KEYS.filter(k => +it[k] > 0);
// who does which step: a staff id, or null = "assign later" (then it only counts as one staff member needed)
const staffPayload = it => Object.fromEntries(activeSteps(it).map(k => [k, it.staffIds[k] || null]));
const stepWho = x => [x.doctor, x.staff || "assign later"].filter(Boolean).join(" + ");
// a select to name (or clear) the staff member of one step of a booking
const assignSelect = (b, x) => `<select class="assign" data-assign="${b.id}" data-step="${x.name}" title="Who does this step. “assign later” still counts as one staff member needed."><option value="">assign later</option>${x.staff_options.map(o => `<option value="${o.id}" ${o.id === x.staff_id ? "selected" : ""}>${esc(o.name)}</option>`).join("")}</select>`;
const locs = () => S.clinic.locations;

async function rawFetch(method, path, body) {
  const res = await fetch(path, { method, headers: {"Content-Type": "application/json"},
                                  body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && S.auth) showLogin("Your session has ended. Please log in again; your work is kept.");
  if (!res.ok) { const err = new Error(data.error || res.statusText); err.status = res.status; throw err; }
  return data;
}

// ---------- password protection (see clinic/auth.py) ----------
function showLogin(message, notConfigured) {
  $("#login").hidden = false;
  $("#login-form").hidden = !!notConfigured; $("#login-setup").hidden = !notConfigured;
  if (message) $("#login-msg").textContent = message;
  if (!notConfigured) setTimeout(() => $("#login-pw").focus(), 0);
}
$("#login-form").onsubmit = async e => {
  e.preventDefault();
  const btn = $("#login-form .btn"); btn.disabled = true; $("#login-err").textContent = "";
  try {
    const res = await fetch("/api/login", { method: "POST", headers: {"Content-Type": "application/json"},
                                            body: JSON.stringify({ password: $("#login-pw").value }) });
    const d = await res.json().catch(() => ({}));
    if (res.ok) { S.unsaved = []; location.reload(); return; }   // reload: the work in progress is picked up again
    $("#login-err").textContent = d.error || "Login failed"; $("#login-pw").select();
  } catch (err) { $("#login-err").textContent = "Couldn't reach the server."; }
  btn.disabled = false;
};
$("#logout").onclick = async () => {
  const n = S.unsaved?.length || 0;
  const msg = S.stateless
    ? `Log out?\n\nThis also removes the copy of your data kept in this browser${n ? `, including your ${n} unsaved file change${n === 1 ? "" : "s"} (use Save… first to download them)` : ""}.`
    : n ? `You have unsaved changes (${S.unsaved.map(u => u.file).join(", ")}). They stay on the server until it restarts. Log out anyway?` : "Log out?";
  if (!confirm(msg)) return;
  try { await fetch("/api/logout", { method: "POST" }); } catch (e) {}
  if (S.stateless) try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  S.unsaved = []; location.reload();
};

// Two modes. Normal: the local server holds the data in memory and writes files when you Save.
// Stateless (the Vercel deployment): the server keeps nothing, so the browser holds the working data
// (S.state, also kept in localStorage), sends it with every call, and takes the new data back.
// Save then downloads the changed files for you to commit.
const STORE_KEY = "clinic-planner-state-v1";
async function api(method, path, body) {
  if (!S.stateless) return rawFetch(method, path, body);
  const [p, qs = ""] = path.split("?"), query = {};
  new URLSearchParams(qs).forEach((v, k) => (query[k] ||= []).push(v));
  const env = await rawFetch("POST", "/api/call", { method, path: p, query, body: body ?? null, state: S.state });
  if (env.status >= 400) { const err = new Error(env.result?.error || "Request failed"); err.status = env.status; throw err; }
  if (env.state) { S.state = env.state; persistState(); }
  return env.result;
}
let storageWarned = false;
function persistState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S.state)); }
  catch (e) { if (!storageWarned) { storageWarned = true; banner("warn", "This browser won't keep your work between visits (storage is full or blocked). Use Save… to download the files."); } }
}
function downloadFiles(files) {   // one download per changed file (spaced out so browsers allow them all)
  Object.entries(files).forEach(([name, text], i) => setTimeout(() => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "application/json" })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }, i * 400));
}
const toDisk = () => S.stateless ? "download the files" : "write to disk";
async function initStatelessState() {
  const deployed = await rawFetch("GET", "/api/initial");   // the data shipped with this deployment
  const fresh = () => ({ version: 1, groups: deployed.groups, base: deployed.groups, lists: deployed.lists, rawHash: deployed.hashes });
  let stored = null; try { stored = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
  S.state = stored && stored.version === 1 && stored.groups && stored.base ? stored : fresh();
  try { await api("GET", "/api/status"); }   // does the stored data still load?
  catch (e) {
    if (S.state === stored && confirm(`The data saved in this browser couldn't be loaded (${e.message}).\n\nStart again from the deployed data? Your browser copy will be discarded.`)) {
      S.state = fresh(); persistState();
    } else throw e;
  }
}
let bannerTimer;
function banner(kind, html, ms) {
  const b = $("#banner"); b.className = kind; b.innerHTML = html;
  clearTimeout(bannerTimer);
  if (ms) bannerTimer = setTimeout(showIssues, ms);
}
function showIssues() {
  if (S.issues.length) banner("warn", `<b>${S.issues.length} booking(s) no longer fit the roster, blocks or opening hours:</b><ul>` +
      S.issues.map(i => `<li>${esc(i)}</li>`).join("") + "</ul>");
  else { const b = $("#banner"); b.className = ""; b.innerHTML = ""; }
}
const fail = e => banner("err", esc(e.message), 8000);
async function guard(fn) { try { await fn(); } catch (e) { fail(e); } }

function applyClinic(d) {
  S.clinic = d.clinic; S.groups = d.groups; S.issues = d.issues; S.weekdays = d.weekdays;
  S.unsaved = d.unsaved || []; S.external = d.external || []; S.dataDir = d.data_dir;
  renderSavebar();
}

// ---------- saving: nothing is written to disk without an explicit confirmation ----------
function renderSavebar() {
  const u = S.unsaved, ex = S.external, bar = $("#savebar");
  const files = u.map(x => `${x.file} (+${x.added} −${x.removed})`).join(", ");
  const st = S.stateless;
  bar.innerHTML =
    (ex.length ? `<span class="state ext" title="${st ? "A newer version of the data has been deployed since you loaded it. Reload to pick it up." : "These files were changed outside the app (e.g. git pull). Reload to pick them up."}">⚠ ${st ? "Newer data deployed" : "Changed on disk"}: ${esc(ex.join(", "))}</span>` : "") +
    (u.length ? `<span class="state dirty" title="${st ? "Held in this browser only. Use Save… to download the files." : "Held in memory only. Not written to disk yet."}">● Unsaved: ${esc(files)}</span>
                 <button class="btn" id="sv-save">${st ? "Save (download)…" : "Save…"}</button><button class="btn secondary" id="sv-discard">Discard</button>`
              : `<span class="state clean">✓ Nothing to save</span>`) +
    (ex.length && (st || !u.length) ? `<button class="btn secondary" id="sv-reload">${st ? "Reload deployed data" : "Reload from disk"}</button>` : "");
  const save = $("#sv-save"), discard = $("#sv-discard"), reload = $("#sv-reload");
  if (save) save.onclick = () => guard(() => saveToDisk());
  if (discard) discard.onclick = () => guard(async () => {
    if (!confirm(st ? "Discard all unsaved changes and go back to the last saved (downloaded) state?\n\nThis cannot be undone."
                    : "Discard all unsaved changes and reload everything from disk?\n\nThis cannot be undone.")) return;
    applyClinic(await api("POST", "/api/discard", {}));
    banner("ok", st ? "Changes discarded." : "Reloaded from disk.", 3000); render();
  });
  if (reload) reload.onclick = () => guard(async () => {
    if (!confirm(st ? "Replace your working data with the data currently deployed?\n\nUnsaved changes in this browser will be lost."
                    : u.length ? "Discard all unsaved changes and reload everything from disk?\n\nThis cannot be undone." : "Reload everything from disk?")) return;
    applyClinic(await api("POST", "/api/discard", { to: "deployed" }));
    banner("ok", st ? "Loaded the deployed data." : "Reloaded from disk.", 3000); render();
  });
}
async function saveToDisk() {
  const u = S.unsaved; if (!u.length) return;
  const list = u.map(x => `  • ${x.file}  (+${x.added} / −${x.removed} lines${x.new ? ", new file" : ""})`).join("\n");
  const st = S.stateless;
  if (!confirm(st ? `Download these changed files?\n\n${list}\n\nThis site can't write to your repository. Put the downloaded files in clinic_data/ and commit them to keep the changes (they also stay in this browser). Files not listed are unchanged.`
                  : `Save these changes to disk?\n\n${list}\n\nThis overwrites the files in ${S.dataDir || "the data folder"}/. Files not listed are left alone.`)) return;
  let r;
  try { r = await api("POST", "/api/save", {}); }
  catch (e) {
    if (e.status !== 409) throw e;
    if (!confirm(`${e.message}.\n\n${st ? "Downloading now would replace those newer deployed changes with the version in this browser" : "Saving now would overwrite those outside changes with the version in the app"}.\n\nContinue anyway? (Cancel, then use “${st ? "Reload deployed data" : "Reload from disk"}”, to keep the ${st ? "deployed" : "outside"} changes and lose yours.)`)) return;
    r = await api("POST", "/api/save", { force: true });
  }
  if (st && r.files) downloadFiles(r.files);
  applyClinic(r);
  banner("ok", st ? `Downloaded ${esc(r.saved.join(", ") || "nothing (already up to date)")}. Put ${r.saved.length === 1 ? "it" : "them"} in clinic_data/ and commit to keep the changes.`
                  : `Saved ${esc(r.saved.join(", ") || "nothing (already up to date)")}.`, 6000);
  render();
}
// keep the bar honest if files change on disk while the app is open (e.g. after a git pull)
async function refreshStatus() {
  try { const d = await api("GET", "/api/status"); S.unsaved = d.unsaved; S.external = d.external; renderSavebar(); } catch (e) {}
}
setInterval(() => { if (!S.stateless) refreshStatus(); }, 4000);   // stateless: only when you come back to the tab
window.addEventListener("focus", refreshStatus);
window.addEventListener("beforeunload", e => { if (S.unsaved?.length) { e.preventDefault(); e.returnValue = ""; } });
async function loadClinic() {
  applyClinic(await api("GET", "/api/clinic"));
  if (!S.location || !byId(locs(), S.location)) S.location = locs()[0]?.id;
  if (!S.avail.treatment || !byId(S.clinic.treatments, S.avail.treatment)) S.avail.treatment = S.clinic.treatments[0]?.id;
  showIssues();
}

const LABEL = 200;  // px width of the name column in timetable rows
// ---------- timetable ----------
async function viewTimetable() {
  S.sel = null;
  S.tt = await api("GET", `/api/timetable?location=${S.location}&date=${S.date}`);
  try { S.savedLists = (await api("GET", "/api/lists")).lists; } catch (e) { S.savedLists = []; fail(e); }
  const t = S.tt, [lo, hi] = t.view, n = hi - lo;
  const cols = `grid-template-columns: ${LABEL}px repeat(${n}, 19px)`;
  const header = `<div class="tt-row" style="${cols}"><div class="tt-label"></div>` +
    Array.from({length: n}, (_, i) => `<div class="tt-hour" style="${(lo + i) % 4 ? "border:0" : ""}">${(lo + i) % 4 ? "" : slotStr(lo + i)}</div>`).join("") + "</div>";
  const bookings = Object.fromEntries(t.bookings.map(b => [b.id, b]));
  const locName = id => byId(locs(), id)?.name || id;

  function rowHtml(r, sub, role) {
    // doctors/staff get a tick box: ticked = in THIS location today (at most one location per day)
    const tickTitle = r.here ? `In ${t.location} today. Untick if they are not in any location.`
      : r.at ? `At ${locName(r.at)} today. Tick to move them to ${t.location}.` : `Not in any location today. Tick to put them in ${t.location}.`;
    const tick = role === "room" ? "" : `<input type="checkbox" class="here" data-role="${role}" data-id="${r.id}" ${r.here ? "checked" : ""} title="${esc(tickTitle)}">`;
    let html = `<div class="tt-row" data-kind="${role}" data-id="${r.id}" style="${cols}"><div class="tt-label" title="${esc(r.name)}">${tick}${esc(r.name)} ${sub ? `<small>${esc(sub)}</small>` : ""}</div>`;
    for (let i = lo; i < hi; ) {
      const c = r.cells[i];
      if (c.startsWith("booked:")) {  // merge consecutive slots of the same booking
        let j = i; while (j < hi && r.cells[j] === c) j++;
        const [, bid, step] = c.split(":");
        const b = bookings[bid];
        const label = b ? `${b.treatment}${STEP_TAG[step] || ""}${b.client ? " · " + b.client : ""}` : "";
        html += `<div class="cell booked${bid === S.list.last ? " latest" : ""}" style="grid-column: span ${j - i}" title="${esc(b ? `${b.treatment} ${b.start}-${b.end}  (room: ${b.room})\n` + b.steps.map(x => `${x.start}-${x.end} ${x.label}: ${stepWho(x)}`).join("\n") + `\nClient: ${b.client || "-"}` : "")}">${esc(label)}</div>`;
        i = j; continue;
      }
      const time = slotStr(i);
      if (c === "free") html += `<div class="cell free" data-start="${time}" title="${time} — free${S.editAvail ? "" : " (click to use as the start time of the next treatment)"}"></div>`;
      else if (c.startsWith("away:")) html += `<div class="cell away" title="${time} — at ${esc(locName(c.slice(5)))}">${esc(locName(c.slice(5))[0])}</div>`;
      else html += `<div class="cell ${c}" title="${time} — ${{off: "not in any location today", closed: "closed", blocked: "blocked (unavailable)"}[c]}"></div>`;
      i++;
    }
    return html + "</div>";
  }
  function totalRowHtml() {   // staff needed in each 15-minute block, named or "assign later", against staff available
    const tot = t.staff_total; if (!tot) return "";
    let html = `<div class="tt-row total-row" style="${cols}"><div class="tt-label" title="How many staff the treatments need in each 15-minute block (named or “assign later”). Hover a cell to compare with the staff ticked in and not blocked."><b>Total staff</b> <small>needed</small></div>`;
    for (let i = lo; i < hi; i++) {
      const need = tot.needed[i], have = tot.available[i];
      const cls = need === 0 ? "none" : need > have ? "over" : need === have ? "full" : "ok";
      html += `<div class="cell tot ${cls}" title="${slotStr(i)} — ${need} staff needed, ${have} available${need > have ? " (shortage)" : need && need === have ? " (all in use)" : ""}">${need || ""}</div>`;
    }
    return html + "</div>";
  }
  const section = (title, rows, sub, role) => `<h4>${title}</h4>` + (rows.length ? rows.map(r => rowHtml(r, sub?.(r), role)).join("") : `<div class="muted">none</div>`);
  const people = list => [...list.filter(r => r.here), ...list.filter(r => !r.here)];
  const away = r => r.here ? "" : r.at ? `(at ${locName(r.at)})` : "(off today)";

  $("#main").innerHTML = `<div class="tt-layout"><div class="tt-main">
    <div class="row">
      <label>Location <select id="loc">${locs().map(l => `<option value="${l.id}" ${l.id === S.location ? "selected" : ""}>${esc(l.name)}</option>`).join("")}</select></label>
      <button class="btn ${S.editAvail ? "" : "secondary"}" id="edit-toggle">${S.editAvail ? "Done editing" : "Edit availability"}</button>
      <button class="btn danger" id="clear-day" title="Remove all bookings and blocked times for ${esc(t.location)} on ${esc(S.date)}">Clear day…</button>
      <div><b>${esc(t.location)}</b> · ${t.hours ? `open ${t.hours[0]}–${t.hours[1]}` : "<span style='color:var(--bad)'>closed this day</span>"}</div>
    </div>
    <div class="legend">
      <span style="--c:var(--free)">free</span><span style="--c:var(--booked)">booked</span>
      <span style="--c:var(--away)">at another location (initial shown)</span>
      <span style="--c:var(--off)">not in any location today</span><span style="--c:var(--closed)">closed</span><span style="--c:var(--blocked)">blocked</span>
      <span style="--c:var(--away)">Total staff: all staff in use</span>
      <span>each cell = 15 min</span>
    </div>
    <div class="card tt">${header}
      ${section("Doctors", people(t.doctors), away, "doctor")}
      ${section("Staff", people(t.staff), away, "staff")}${totalRowHtml()}
      ${section("Treatment rooms", t.rooms, null, "room")}
    </div>
    <div id="editbar" class="card" ${S.editAvail ? "" : "hidden"}></div>
    </div><aside id="book-panel" class="card book-panel"></aside></div>`;
  $("#loc").onchange = e => { S.location = e.target.value; render(); };
  $(".tt").classList.toggle("edit", S.editAvail);
  $("#edit-toggle").onclick = () => { S.editAvail = !S.editAvail; viewTimetable(); };
  $("#clear-day").onclick = () => guard(async () => {
    const body = { location_id: S.location, date: S.date }, where = `${t.location} on ${S.date}`;
    const p = await api("POST", "/api/clear-day", { ...body, dry_run: true });
    if (!p.bookings && !p.blocks) { banner("ok", `Nothing to clear at ${esc(where)}: no bookings or blocked times.`, 4000); return; }
    const lines = p.booking_details.slice(0, 8).map(b => `  • ${b.start} ${b.treatment}${b.client ? " (" + b.client + ")" : ""} – ${b.doctor || "staff only"}, ${b.room}`);
    if (p.booking_details.length > 8) lines.push(`  • …and ${p.booking_details.length - 8} more`);
    const msg = `Clear ${where}?\n\n` +
      `${p.bookings} booking${p.bookings === 1 ? "" : "s"} will be CANCELLED:\n${lines.join("\n") || "  (none)"}\n\n` +
      `${p.blocks} blocked time${p.blocks === 1 ? "" : "s"} will be removed` + (p.blocked.length ? ` (${p.blocked.join(", ")})` : "") + `.\n\n` +
      `Who is ticked in is not changed. This only changes the working copy; nothing is ${S.stateless ? "downloaded" : "written to disk"} until you press Save… (Discard undoes it).`;
    if (!confirm(msg)) return;
    const r = await api("POST", "/api/clear-day", body);
    await loadClinic(); await viewTimetable();
    if (!S.issues.length) banner("ok", `Cleared ${r.bookings} booking(s) and ${r.blocks} blocked time(s) at ${esc(where)}. Press Save… to ${toDisk()}.`, 5000);
  });
  if (S.editAvail) setupEditing(lo, n);
  $(".tt").onchange = async e => {  // the tick boxes
    const cb = e.target.closest("input.here"); if (!cb) return;
    try {
      const r = await api("PUT", "/api/presence", { role: cb.dataset.role, person_id: cb.dataset.id, date: S.date,
        location_id: cb.checked ? S.location : null });
      await loadClinic(); await viewTimetable();
    } catch (err) { fail(err); try { await viewTimetable(); } catch (e) {} }
  };
  $(".tt").onclick = e => {
    if (S.editAvail) return;
    const c = e.target.closest(".cell.free"); if (!c) return;
    const row = c.closest(".tt-row");   // use this time (and this room, if it is a room row) for the next treatment
    queueItem(it => { it.start = c.dataset.start; if (row?.dataset.kind === "room") it.room = row.dataset.id; });
    drawBookingPanel();
  };
  drawBookingPanel();
}

// ---------- booking panel (Timetable tab): add treatments one after another and watch the grid fill up ----------
// A treatment is given by its numbing / doctor treatment / staff treatment minutes and the room.
// The one rule: if the doctor treatment time is 0, the numbing time is 0 too.
const MINUTES = Array.from({ length: 17 }, (_, i) => i * 15);          // 0, 15 … 240
const minOpts = sel => MINUTES.map(m => `<option value="${m}" ${m === +sel ? "selected" : ""}>${m}</option>`).join("");
const roomsHere = () => S.tt?.rooms || [];
const fitRoom = presetId => { const t = byId(S.clinic.treatments, presetId), rooms = roomsHere();
  return (t && rooms.find(r => t.required_equipment.every(e => r.equipment.includes(e))))?.id || rooms[0]?.id || null; };
const newItem = from => ({ preset: from?.preset || "", name: from?.preset ? from.name : "", numbing: from?.numbing ?? 15, doctor: from?.doctor ?? 30,
  staff: from?.staff ?? 15, room: from?.room || null, doctorId: "", staffIds: {}, start: from?.start || "10:00", client: "",
  status: "pending", booking: null, reasons: [], preview: null, note: "", touched: false });
const resetItem = it => { if (it.status === "failed") it.status = "pending"; it.reasons = []; it.preview = null; it.note = ""; S.list.summary = ""; };
function applyPreset(it, id) {   // optional template: fills the name and the three times, picks a room with its equipment
  it.preset = id || "";
  const t = byId(S.clinic.treatments, id); if (!t) return;
  it.name = t.name; it.numbing = t.numbing_minutes; it.doctor = t.doctor_minutes; it.staff = t.staff_minutes; it.room = fitRoom(id);
}
function fixItem(it) {   // keep a row consistent with where we are and with the one rule
  if (!roomsHere().some(r => r.id === it.room)) {
    const had = !!it.room; it.room = fitRoom(it.preset);
    if (had) it.note = "The room it had isn't at this location (or no longer exists): check the room.";
  }
  if (+it.doctor === 0) it.numbing = 0;
  const here = new Set((S.tt?.staff || []).filter(r => r.here).map(r => r.id)), on = new Set(activeSteps(it));
  for (const k of Object.keys(it.staffIds)) {   // a named staff member must be ticked in here, and the step must exist
    if (!on.has(k)) delete it.staffIds[k];
    else if (it.staffIds[k] && !here.has(it.staffIds[k])) { delete it.staffIds[k]; it.note = "A named staff member isn't ticked in at this location, so that step is back to “assign later”."; }
  }
}
// Fill the next not-yet-booked row. With {append: true} (used when sending from another tab) a row the user has
// already edited is never overwritten: an untouched blank row is reused, otherwise a new row is added.
function queueItem(change, { append = false } = {}) {
  const L = S.list; let it = L.items.find(i => i.status !== "booked" && (!append || !i.touched));
  if (!it) { it = newItem(L.items[L.items.length - 1]); L.items.push(it); }
  change(it); it.touched = true; resetItem(it);
}
function drawBookingPanel() {
  const L = S.list, t = S.tt, panel = $("#book-panel"), rooms = roomsHere(), presets = S.clinic.treatments;
  if (!rooms.length) { panel.innerHTML = `<h3>Add treatments</h3><div class="muted">${esc(t.location)} has no treatment rooms yet. Add some under <b>Setup &amp; save</b> (<code>rooms</code> in resources.json).</div>`; return; }
  if (!L.items.some(i => i.status !== "booked")) L.items.push(newItem(L.items[L.items.length - 1]));
  L.items.forEach(it => { if (it.status !== "booked") fixItem(it); });
  const steps = b => b.steps.map(x => `${esc(x.label)} ${x.start}–${x.end}: ${esc(stepWho(x))}`).join("<br>");
  const detail = b => `Room: ${esc(b.room)}${b.doctor ? " · " + esc(b.doctor) : ""}<div class="bk-steps">${steps(b)}</div>`;
  const bookedDetail = b => `Room: ${esc(b.room)}${b.doctor ? " · " + esc(b.doctor) : ""}<div class="bk-steps">` +
    b.steps.map(x => `<div class="bk-step"><span>${esc(x.label)} ${x.start}–${x.end}${x.doctor ? " · " + esc(x.doctor) : ""}</span>${assignSelect(b, x)}</div>`).join("") + `</div>`;
  const hereStaff = (S.tt?.staff || []).filter(r => r.here);
  const endOf = it => slotStr(Math.min(96, (+it.start.slice(0, 2)) * 4 + (+it.start.slice(3)) / 15 + (+it.numbing + +it.doctor + +it.staff) / 15));
  const rows = L.items.map((it, i) => {
    if (it.status === "booked") { const b = it.booking, away = b.location_id !== S.location || b.date !== S.date;
      return `<div class="bk-row ok" data-i="${i}"><span class="pill yes">booked</span> <b>${i + 1}. ${esc(b.treatment)}</b> ${b.start}–${b.end}${b.client ? " · " + esc(b.client) : ""}
        <button class="link" data-cancel="${i}" title="Cancel this booking">cancel</button>
        <div class="muted">${away ? `${esc(b.location)} · ${b.date}<br>` : ""}${bookedDetail(b)}</div></div>`; }
    const p = it.preview, total = +it.numbing + +it.doctor + +it.staff;
    const preview = !p ? "" : p.status === "booked" ? `<span class="pill yes">can be done</span><div class="muted">${detail(p.booking)}</div>`
      : p.status === "failed" ? `<span class="pill no">cannot be performed</span><ul class="reasons">${p.reasons.map(m => `<li>${esc(m)}</li>`).join("")}</ul>`
      : `<span class="muted">not attempted</span>`;
    return `<div class="bk-row ${it.status === "failed" ? "bad" : ""}" data-i="${i}">
      <div class="bk-edit"><span class="n">${i + 1}.</span><input data-f="name" placeholder="treatment name (optional)" value="${esc(it.name)}">
        <label title="Proposed start time">Start<select data-f="start">${timeOptions(it.start, 95)}</select></label></div>
      ${presets.length ? `<div class="bk-edit"><select data-f="preset" title="Optional: fills in the name and the three times. Its doctor skills and room equipment are then enforced."><option value="">Template (optional): custom treatment</option>${presets.map(x => `<option value="${x.id}" ${x.id === it.preset ? "selected" : ""}>${esc(x.name)} (${totalMin(x)} min)</option>`).join("")}</select></div>` : ""}
      <div class="bk-mins">
        <label title="Numbing: 1 staff. Must be 0 when the doctor treatment is 0.">Numbing (min)<select data-f="numbing" ${+it.doctor === 0 ? "disabled" : ""}>${minOpts(it.numbing)}</select></label>
        <label title="Doctor treatment: a doctor + 1 staff">Doctor (min)<select data-f="doctor">${minOpts(it.doctor)}</select></label>
        <label title="Staff treatment: 1 staff">Staff (min)<select data-f="staff">${minOpts(it.staff)}</select></label></div>
      <div class="bk-edit"><label class="grow">Room<select data-f="room">${rooms.map(r => `<option value="${r.id}" ${r.id === it.room ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></label>
        ${+it.doctor > 0 ? `<label class="grow">Doctor<select data-f="doctorId"><option value="">any available</option>${S.clinic.doctors.map(d => `<option value="${d.id}" ${d.id === it.doctorId ? "selected" : ""}>${esc(d.name)}</option>`).join("")}</select></label>` : ""}</div>
      ${activeSteps(it).length ? `<div class="bk-mins" style="grid-template-columns: repeat(${activeSteps(it).length}, 1fr)">${activeSteps(it).map(k => `
        <label title="Who does this step. “assign later” leaves it open: it still counts as one staff member needed (see Total staff).">${{numbing: "Numbing", doctor: "Doctor-step", staff: "Staff-step"}[k]} staff<select data-f="staff:${k}"><option value="">assign later</option>${hereStaff.map(r => `<option value="${r.id}" ${r.id === it.staffIds[k] ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></label>`).join("")}</div>` : ""}
      <div class="bk-edit"><input data-f="client" placeholder="client (optional)" value="${esc(it.client)}"><button class="link" data-rm="${i}">remove</button></div>
      <div class="muted">${total ? `Total ${total} min, ${it.start}–${endOf(it)}` : "Set at least one time above 0"}${+it.doctor === 0 ? " · staff alone, no doctor" : ""}${it.preset ? " · template skills/equipment apply" : ""}</div>
      ${it.status === "failed" ? `<span class="pill no">cannot be performed</span><ul class="reasons">${it.reasons.map(m => `<li>${esc(m)}</li>`).join("")}</ul>` : ""}
      ${it.note ? `<div class="muted">${esc(it.note)}</div>` : ""}${preview}</div>`;
  }).join("");
  const nBooked = L.items.filter(i => i.status === "booked").length, nWait = L.items.length - nBooked, saved = S.savedLists || [];
  panel.innerHTML = `<div class="bk-head"><div><b>Add treatments</b> · ${esc(t.location)}<div class="muted">${esc(S.date)} · ${nBooked} booked · ${nWait} waiting</div></div>
      <button class="btn" id="bk-next-top" title="Book the first treatment in the list that isn't booked yet">Book next</button></div>
    <div class="bk-lists"><button class="btn secondary" id="ls-save" title="Save this list of treatments under a name (asks you to confirm)">Save list…</button>
      ${saved.length ? `<select id="ls-pick" title="Saved lists">${saved.map(l => `<option value="${esc(l.name)}" ${l.name === S.listName ? "selected" : ""}>${esc(l.name)} (${l.count}${l.location ? ", " + esc(l.location) : ""})</option>`).join("")}</select>
        <button class="btn secondary" id="ls-load">Load</button><button class="link" id="ls-del" title="Delete the selected saved list">delete</button>`
        : `<span class="muted">no saved lists yet</span>`}</div>
    <details style="margin-bottom:8px"><summary class="muted" style="cursor:pointer">How this works</summary>
      <div class="muted" style="margin-top:4px">Give the numbing, doctor treatment and staff treatment times and the room, then press <b>Book next</b>; the grid updates so you can see how the rooms, doctors and staff fill up.
      The doctor is chosen automatically (or pick one). Staff are interchangeable: leave a step on <b>assign later</b> (it still counts as one staff member in the <b>Total staff</b> row) or name someone, and name them afterwards from the booked row.
      The staff needed in any 15-minute block can't exceed the staff ticked in, and a named person can't be in two overlapping steps. Numbing is 0 when there is no doctor treatment. Click a free cell to use that time (and, on a room row, that room).
      A treatment that can't be carried out (not enough doctor, staff or room) is reported and nothing is booked for it.
      <b>Save list…</b> stores the treatments in this list (times, rooms, names, clients; not the bookings) so you can <b>Load</b> them again later.</div></details>
    ${rows}
    <div class="row" style="margin:10px 0 0">
      <button class="btn" id="bk-next" title="Book the first treatment in the list that isn't booked yet">Book next</button>
      <button class="btn secondary" id="bk-all" title="Go down the list in order; stops at the first treatment that can't be carried out">Book all</button>
      <button class="btn secondary" id="bk-check" title="Dry run: shows what would happen, books nothing">Check all</button>
      <button class="btn secondary" id="bk-add">+ Add</button>
      <button class="btn secondary" id="bk-clear" title="Empties this list; bookings already made stay in the schedule">Clear list</button></div>
    ${L.summary ? `<div style="margin-top:10px">${L.summary}</div>` : ""}`;
  panel.oninput = e => { const row = e.target.closest("[data-i]"), f = e.target.dataset.f;
    if (row && (f === "client" || f === "name")) { const it = L.items[+row.dataset.i]; it[f] = e.target.value; it.touched = true; } };
  panel.onchange = e => { const el = e.target, row = el.closest("[data-i]"), f = el.dataset.f;
    if (el.dataset.assign) return guard(() => assignStaff(el.dataset.assign, el.dataset.step, el.value));
    if (!row || !f || f === "client" || f === "name") return;
    const it = L.items[+row.dataset.i];
    if (f.startsWith("staff:")) it.staffIds[f.slice(6)] = el.value;
    else if (f === "preset") applyPreset(it, el.value); else it[f] = el.value;
    it.touched = true; resetItem(it); drawBookingPanel(); };
  panel.onclick = e => { const el = e.target;
    if (el.id === "bk-add") { L.items.push(newItem(L.items[L.items.length - 1])); drawBookingPanel(); }
    else if (el.dataset.rm !== undefined) { L.items.splice(+el.dataset.rm, 1); L.summary = ""; drawBookingPanel(); }
    else if (el.id === "bk-clear") { L.items = []; L.summary = ""; L.last = null; viewTimetable(); }
    else if (el.dataset.cancel !== undefined) guard(() => cancelBooked(+el.dataset.cancel));
    else if (el.id === "bk-next" || el.id === "bk-next-top") guard(() => runBooking("next"));
    else if (el.id === "ls-save") guard(saveList);
    else if (el.id === "ls-load") guard(() => loadList($("#ls-pick").value));
    else if (el.id === "ls-del") guard(() => deleteList($("#ls-pick").value));
    else if (el.id === "bk-all") guard(() => runBooking("all"));
    else if (el.id === "bk-check") guard(() => runBooking("check")); };
  if (L.scrollNext) {   // keep the next row to fill in in view so you can keep pressing Book next
    L.scrollNext = false;
    const row = panel.querySelector(".bk-row:not(.ok)"); if (row) panel.scrollTop = Math.max(0, row.offsetTop - 90);
  }
}

// ---------- saved lists: explicit, confirmed saves into treatment_lists.json; load replaces the list in this panel ----------
const toApiItem = it => ({ name: it.name, treatment_id: it.preset || null, numbing_minutes: +it.numbing, doctor_minutes: +it.doctor,
  staff_minutes: +it.staff, room_id: it.room, doctor_id: it.doctorId || null, staff: staffPayload(it), start: it.start, client: it.client });
async function saveList() {
  const L = S.list, t = S.tt;
  if (!L.items.length) throw new Error("The list is empty: add a treatment first.");
  const name = (prompt(`Save this list (${L.items.length} treatment${L.items.length === 1 ? "" : "s"} at ${t.location}) as:`, S.listName || "") || "").trim();
  if (!name) return;
  const exists = (S.savedLists || []).some(l => l.name === name);
  if (!confirm(`${exists ? `Replace the saved list “${name}”?` : `Save a new list “${name}”?`}\n\n` +
      `${L.items.length} treatment${L.items.length === 1 ? "" : "s"} at ${t.location}: times, rooms, names and clients (not the bookings).\n\n` +
      (S.stateless ? "The list is kept in this browser only (it isn't written to the repository)." : `This writes treatment_lists.json in ${S.dataDir || "the data folder"}/. Nothing else is changed.`))) return;
  const r = await api("PUT", "/api/lists", { name, location_id: S.location, items: L.items.map(toApiItem), overwrite: exists });
  S.savedLists = r.lists; S.listName = name; drawBookingPanel();
  banner("ok", `Saved the list “${esc(name)}” (${L.items.length}).`, 4000);
}
async function loadList(name) {
  const l = (S.savedLists || []).find(x => x.name === name); if (!l) return;
  const L = S.list;
  if (L.items.some(i => i.status === "booked" || i.touched) &&
      !confirm(`Replace the list in this panel with “${l.name}” (${l.count} treatment${l.count === 1 ? "" : "s"})?\n\nBookings already made stay in the schedule; only the list here is replaced.`)) return;
  L.items = l.items.map(x => Object.assign(newItem(), { preset: x.treatment_id || "", name: x.name || "", numbing: x.numbing_minutes,
    doctor: x.doctor_minutes, staff: x.staff_minutes, room: x.room_id, doctorId: x.doctor_id || "", start: x.start, client: x.client || "", touched: true,
    staffIds: Object.fromEntries(Object.entries(x.staff || {}).filter(([, v]) => v)) }));
  L.summary = ""; L.last = null; L.scrollNext = true; S.listName = l.name;
  const moved = l.location_id && l.location_id !== S.location && byId(locs(), l.location_id);
  if (moved) S.location = l.location_id;   // a list belongs to a location (its rooms)
  await viewTimetable();
  banner("ok", `Loaded “${esc(l.name)}”${moved ? ` (switched to ${esc(l.location)})` : ""}. Press Book next to start.`, 4000);
}
async function deleteList(name) {
  if (!name || !confirm(`Delete the saved list “${name}”?${S.stateless ? "" : "\n\nThis rewrites treatment_lists.json without it."}`)) return;
  const r = await api("DELETE", `/api/lists?name=${encodeURIComponent(name)}`);
  S.savedLists = r.lists; if (S.listName === name) S.listName = null; drawBookingPanel();
  banner("ok", `Deleted the saved list “${esc(name)}”.`, 3000);
}
// name (or clear) who does a step of an existing booking; the server enforces the staff rules
async function assignStaff(bookingId, step, staffId) {
  const keep = $("#book-panel")?.scrollTop || 0;
  try {
    const r = await api("PUT", `/api/bookings/${bookingId}/staff`, { staff: { [step]: staffId || null } });
    const it = S.list.items.find(i => i.booking?.id === bookingId); if (it) it.booking = r.booking;
    await loadClinic(); await viewTimetable();
    const panel = $("#book-panel"); if (panel) panel.scrollTop = keep;
  } catch (e) {
    fail(e); if (S.tab === "timetable") drawBookingPanel(); else await render();   // put the select back
  }
}
async function assignStaffRoster(bookingId, step, staffId) {
  try { await api("PUT", `/api/bookings/${bookingId}/staff`, { staff: { [step]: staffId || null } }); await loadClinic(); await viewRoster(); }
  catch (e) { fail(e); await viewRoster(); }
}
async function cancelBooked(i) {
  const it = S.list.items[i];
  await api("DELETE", `/api/bookings/${it.booking.id}`);
  if (S.list.last === it.booking.id) S.list.last = null;
  it.status = "pending"; it.booking = null; S.list.summary = ""; S.list.scrollNext = true;
  await loadClinic(); await viewTimetable();
}
async function runBooking(mode) {   // "next" | "all" | "check" (dry run)
  const L = S.list, idx = L.items.map((_, i) => i).filter(i => L.items[i].status !== "booked");
  if (!idx.length) return;
  const use = mode === "next" ? idx.slice(0, 1) : idx;
  const r = await api("POST", "/api/book-list", { location_id: S.location, date: S.date, dry_run: mode === "check",
    items: use.map(i => { const it = L.items[i];
      return { name: it.name, numbing_minutes: +it.numbing, doctor_minutes: +it.doctor, staff_minutes: +it.staff, room_id: it.room,
               doctor_id: it.doctorId || undefined, treatment_id: it.preset || undefined, staff: staffPayload(it), start: it.start, client: it.client }; }) });
  r.results.forEach((x, k) => { const it = L.items[use[k]]; it.reasons = []; it.preview = null; it.note = "";
    if (mode === "check") it.preview = { status: x.status, reasons: x.reasons || [], booking: x.booking };
    else if (x.status === "booked") { it.status = "booked"; it.booking = x.booking; L.last = x.booking.id; }
    else if (x.status === "failed") { it.status = "failed"; it.reasons = x.reasons; }
    else it.note = "Not attempted: an earlier treatment in the list could not be carried out."; });
  const n = r.total, verb = mode === "check" ? "can be carried out" : "booked", f = r.stopped_at;
  L.summary = mode === "next" ? "" : f === null ? `<span class="pill yes">All ${n} ${verb}</span>`
    : `<span class="pill no">${r.booked} of ${n} ${verb}</span> Stopped at <b>${use[f] + 1}</b>: it cannot be performed.` + (n - f - 1 ? ` ${n - f - 1} after it not attempted.` : "");
  L.scrollNext = true;
  if (mode === "check") drawBookingPanel();
  else { await loadClinic(); await viewTimetable(); }
}

// ---------- edit availability (drag on timetable rows) ----------
function setupEditing(lo, n) {
  const tt = $(".tt"), COL = 19;
  const rowOf = () => tt.querySelector(`.tt-row[data-kind="${S.sel.kind}"][data-id="${S.sel.id}"]`);
  const slotAt = (row, x) => lo + Math.max(0, Math.min(n - 1, Math.floor((x - row.getBoundingClientRect().left - LABEL) / COL)));
  const range = () => [Math.min(S.sel.a, S.sel.b), Math.max(S.sel.a, S.sel.b)];
  function drawSel() {
    tt.querySelectorAll(".sel").forEach(el => el.remove());
    if (!S.sel) return;
    const [a, b] = range(), el = document.createElement("div");
    el.className = "sel"; el.style.left = (LABEL + (a - lo) * COL) + "px"; el.style.width = ((b - a + 1) * COL - 1) + "px";
    rowOf().appendChild(el);
  }
  tt.onpointerdown = e => {
    const row = e.target.closest(".tt-row[data-kind]");
    if (!row || e.clientX - row.getBoundingClientRect().left < LABEL) return;
    e.preventDefault();
    const a = slotAt(row, e.clientX);
    S.sel = { kind: row.dataset.kind, id: row.dataset.id, a, b: a, dragging: true };
    drawSel(); renderEditBar();
  };
  window.onpointermove = e => { if (S.sel?.dragging) { S.sel.b = slotAt(rowOf(), e.clientX); drawSel(); } };
  window.onpointerup = () => { if (S.sel?.dragging) { S.sel.dragging = false; renderEditBar(); } };
  renderEditBar();
}
function renderEditBar() {
  const bar = $("#editbar"), sel = S.sel, t = S.tt;
  if (!sel) { bar.innerHTML = `<b>Edit availability</b><div class="muted">Drag across a doctor, staff or room row to select a time range (each cell = 15 min), then choose what to do. Nothing changes until you press a button.</div>`; return; }
  const [a, b] = [Math.min(sel.a, sel.b), Math.max(sel.a, sel.b)], start = slotStr(a), end = slotStr(b + 1);
  const list = t[{doctor: "doctors", staff: "staff", room: "rooms"}[sel.kind]], name = list.find(r => r.id === sel.id).name;
  const room = sel.kind === "room", what = room ? "room" : "time";
  bar.innerHTML = `<b>${esc(name)}</b> · ${start}–${end} on ${esc(S.date)}
    <div class="row" style="margin:10px 0 0">
      <button class="btn danger" data-act="false">Block ${what} (unavailable)</button>
      <button class="btn" data-act="true">Unblock (available)</button>
      <label>Repeat weekly until (optional) <input type="date" id="rep" min="${S.date}"></label>
      <button class="btn secondary" data-cancel="1">Clear selection</button>
    </div>
    <div class="muted" style="margin-top:8px">${room
      ? "Blocked rooms can't be booked (e.g. maintenance)."
      : "Doctors and staff who are ticked in are free all day unless booked or blocked. Block a time for lunch, leave, etc. (use the tick box for which location they are in)."}
      Existing bookings are kept but flagged. Repeat applies to the same weekday each week.</div>`;
  bar.onclick = e => {
    if (e.target.dataset.cancel) { S.sel = null; $("#main").querySelectorAll(".sel").forEach(x => x.remove()); renderEditBar(); return; }
    const act = e.target.dataset.act; if (act === undefined) return;
    guard(async () => {
      const r = await api("PUT", "/api/availability", { kind: sel.kind, id: sel.id, date: S.date,
        start, end, available: act === "true", repeat_until: $("#rep").value || undefined });
      await loadClinic(); await viewTimetable();
      if (!S.issues.length) banner("ok", `${esc(name)} ${start}–${end} updated${r.days > 1 ? ` for ${r.days} weeks` : ""}.`, 3000);
    });
  };
}

async function checkAvail() {

async function findSlots() {

function drawAvailResults() {
  const A = S.avail, out = $("#a-out");

}

// ---------- roster (who is at which location each day) & bookings ----------
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const mondayOf = iso => addDays(iso, -((new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7));
async function viewRoster() {
  const F = S.rosterForm; F.from ||= S.date; F.to ||= S.date;
  S.weekOf = mondayOf(S.weekOf || S.date);
  const [roster, {bookings}] = await Promise.all([api("GET", `/api/roster?start=${S.weekOf}&days=7`), api("GET", `/api/bookings?date=${S.date}`)]);
  const everyone = roster.people.map(p => ({...p, key: p.role + ":" + p.id}));
  F.who ||= everyone[0]?.key;
  const dayNames = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const cell = (p, i) => `<td><select data-role="${p.role}" data-id="${p.id}" data-date="${roster.dates[i]}" class="${p.at[i] ? "set" : ""}">
      <option value="">—</option>${locs().map(l => `<option value="${l.id}" ${p.at[i] === l.id ? "selected" : ""}>${esc(l.name)}</option>`).join("")}</select></td>`;
  const rows = role => everyone.filter(p => p.role === role).map(p => `<tr><td>${esc(p.name)}</td>${roster.dates.map((_, i) => cell(p, i)).join("")}</tr>`).join("");
  $("#main").innerHTML = `
    <div class="card"><h3>Roster · week of ${esc(roster.dates[0])}</h3>
      <div class="row"><button class="btn secondary" data-week="-7">← Previous week</button>
        <button class="btn secondary" data-week="0">Week of selected date</button>
        <button class="btn secondary" data-week="7">Next week →</button></div>
      <table class="roster"><tr><th></th>${roster.dates.map((d, i) => `<th>${dayNames[i]} ${d.slice(8)}</th>`).join("")}</tr>
        <tr class="group"><td colspan="8">Doctors</td></tr>${rows("doctor") || `<tr><td colspan="8" class="muted">none</td></tr>`}
        <tr class="group"><td colspan="8">Staff</td></tr>${rows("staff") || `<tr><td colspan="8" class="muted">none</td></tr>`}</table>
      <div class="muted" style="margin-top:8px">Pick the one location each person is at that day, or “—” if they are not in any location. Anyone in a location is free all day there unless booked or blocked. The same thing is the tick box on the Timetable tab.</div>
    </div>
    <div class="card"><h3>Set a location for many days</h3>
      <div class="row">
        <label>Who <select id="f-who">${everyone.map(p => `<option value="${p.key}" ${p.key === F.who ? "selected" : ""}>${esc(p.name)} (${p.role})</option>`).join("")}</select></label>
        <label>Location <select id="f-loc"><option value="">— not in any location</option>${locs().map(l => `<option value="${l.id}" ${l.id === F.location ? "selected" : ""}>${esc(l.name)}</option>`).join("")}</select></label>
        <label>First date <input type="date" id="f-from" value="${F.from}"></label>
        <label>Last date <input type="date" id="f-to" value="${F.to}"></label>
        <div><div class="muted" style="font-size:12px;margin-bottom:3px">On weekdays</div><div class="days">
          ${dayNames.map((n, i) => `<label><input type="checkbox" data-day="${i}" ${F.days.includes(i) ? "checked" : ""}>${n}</label>`).join("")}</div></div>
        <button class="btn" id="f-add">Apply</button>
      </div></div>
    <div class="card"><h3>Bookings on ${esc(S.date)}</h3>
      ${bookings.length ? `<table><tr><th>Time</th><th>Treatment</th><th>Location / room</th><th>Doctor</th><th>Staff</th><th>Client</th><th></th></tr>` +
        bookings.map(b => `<tr><td>${b.start}–${b.end}</td><td>${esc(b.treatment)}</td><td>${esc(b.location)} / ${esc(b.room)}</td>
          <td>${esc(b.doctor || "— (staff only)")}</td><td>${b.steps.map(x => `<div><span class="muted">${esc(x.label)}:</span> ${assignSelect(b, x)}</div>`).join("")}</td><td>${esc(b.client)}</td>
          <td><button class="link" data-del-booking="${b.id}">cancel</button></td></tr>`).join("") + "</table>"
        : `<span class="muted">No bookings.</span>`}
    </div>`;
  const savePresence = (role, id, dates, location) => guard(async () => {
    const r = await api("PUT", "/api/presence", { role, person_id: id, dates, location_id: location || null });
    await loadClinic(); await viewRoster();
    if (!S.issues.length) banner("ok", `Roster updated (${r.days} day${r.days > 1 ? "s" : ""}).`, 3000);
  });
  $("#main").onchange = e => { const t = e.target;
    if (t.dataset.assign) return guard(async () => { await assignStaffRoster(t.dataset.assign, t.dataset.step, t.value); });
    if (t.matches("table.roster select")) savePresence(t.dataset.role, t.dataset.id, [t.dataset.date], t.value); };
  $("#f-who").onchange = e => F.who = e.target.value;

  $("#f-to").onchange = e => F.to = e.target.value;
  document.querySelectorAll("[data-day]").forEach(cb => cb.onchange = () =>
    F.days = [...document.querySelectorAll("[data-day]:checked")].map(x => +x.dataset.day));
  $("#f-add").onclick = () => {
    const dates = []; if (F.from > F.to) return fail(new Error("'Last date' is before 'First date'"));
    for (let d = F.from; d <= F.to; d = addDays(d, 1)) if (F.days.includes((new Date(d + "T00:00:00Z").getUTCDay() + 6) % 7)) dates.push(d);
    if (!dates.length) return fail(new Error("No dates match the chosen weekdays"));
    if (dates.length > 800) return fail(new Error("Too many days at once (max 800)"));
    const [role, id] = F.who.split(":"); savePresence(role, id, dates, F.location);
  };
  $("#main").onclick = e => {
    const w = e.target.dataset.week, b = e.target.dataset.delBooking;
    if (w !== undefined) { S.weekOf = w === "0" ? mondayOf(S.date) : addDays(S.weekOf, +w); guard(viewRoster); }
    if (b) guard(async () => { await api("DELETE", `/api/bookings/${b}`); await loadClinic(); await viewRoster(); });
  };
}

          </table><button class="btn" data-save-hours="${l.id}">Save ${esc(l.name)} hours</button></div>`).join("")}
      </div>
      <div class="muted">One-off closures / special hours: edit <code>date_overrides</code> in the JSON below (e.g. <code>"2026-12-25": null</code>).</div>
    </div>
    <div class="card"><h3>Clinic data files</h3>
      <div class="muted" style="margin-bottom:8px">The clinic is stored as three JSON files, grouped by how often they change. Changes are held in memory until you press <b>Save…</b> in the top bar (you'll be asked to confirm). Edit the JSON here for anything without a form (add rooms, treatments, doctors, skills…), press Validate &amp; apply, then Save.</div>
      <div class="gtabs" id="gtabs"></div>
      <div class="muted" id="gdesc" style="margin-bottom:8px"></div>
      <textarea class="json" id="json" spellcheck="false"></textarea>
      <div class="row" style="margin:10px 0 0">
        <button class="btn" id="j-save">Validate &amp; apply</button>
        <button class="btn secondary" id="j-reload">Discard edits</button>
        <button class="btn secondary" id="j-down">Download file</button>
        <label>Upload file <input type="file" id="j-up" accept=".json,application/json"></label>
      </div></div>`;
  const GROUPS = {
    resources: ["1 · Resources", "resources.json", "Locations, rooms (with their equipment), doctors and staff. Changes rarely."],
    planning: ["2 · Planning", "planning.json", "Opening hours, one-off date overrides, treatments and doctor skills. Changes regularly."],
    schedule: ["3 · Schedule", "schedule.json", "Presence (which location each doctor/staff member is in each day), blocked times for doctors, staff and rooms, and bookings. Changes constantly."],
  };
  const pretty = o => JSON.stringify(o, null, 2).replace(/\[\s+([^\[\]{}]*?)\s+\]/g, (m, inner) => "[" + inner.replace(/,\s+/g, ", ") + "]");
  const fillJson = () => {
    const g = S.setupGroup;
    $("#gtabs").innerHTML = Object.entries(GROUPS).map(([k, v]) => `<button class="btn ${k === g ? "" : "secondary"}" data-g="${k}">${v[0]}</button>`).join("");
    $("#gdesc").innerHTML = `<b>${GROUPS[g][1]}</b> — ${esc(GROUPS[g][2])}`;
    $("#json").value = pretty(S.groups[g]);
  };
  fillJson();
  $("#gtabs").onclick = e => { if (e.target.dataset.g) { S.setupGroup = e.target.dataset.g; fillJson(); } };
  document.querySelectorAll("[data-save-hours]").forEach(btn => btn.onclick = () => guard(async () => {
    const box = btn.closest("[data-hours]"), hours = {};
    S.weekdays.forEach(d => { hours[d] = $(`.open[data-d=${d}]`, box).checked
      ? [$(`select[data-d=${d}][data-k=o]`, box).value, $(`select[data-d=${d}][data-k=c]`, box).value] : null; });
    applyClinic(await api("PUT", `/api/locations/${btn.dataset.saveHours}/hours`, { hours }));
    fillJson(); showIssues();
    if (!S.issues.length) banner("ok", `Opening hours updated. Press Save… (top bar) to ${toDisk()}.`, 3000);
  }));
  $("#j-save").onclick = () => guard(async () => {
    let data; try { data = JSON.parse($("#json").value); } catch (e) { throw new Error("Not valid JSON: " + e.message); }
    applyClinic(await api("PUT", "/api/clinic", { [S.setupGroup]: data }));
    await loadClinic(); fillJson(); showIssues();
    if (!S.issues.length) banner("ok", `${GROUPS[S.setupGroup][1]} applied. Press Save… (top bar) to ${toDisk()}.`, 3000);
  });
  $("#j-reload").onclick = () => guard(async () => { await loadClinic(); fillJson(); });
  $("#j-down").onclick = () => { const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([$("#json").value + "\n"], {type: "application/json"}));
    a.download = GROUPS[S.setupGroup][1]; a.click(); };
  $("#j-up").onchange = async e => { const f = e.target.files[0]; if (f) $("#json").value = await f.text(); };
}

// ---------- boot ----------
(async () => {
  const d = new Date(); S.date = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  let ready = false;
  await guard(async () => {
    const mode = await fetch("/api/mode").then(r => r.ok ? r.json() : { mode: "server" }).catch(() => ({ mode: "server" }));
    S.stateless = mode.mode === "stateless"; S.auth = !!mode.auth;
    if (mode.misconfigured) return showLogin(null, true);                 // required password isn't set: show nothing
    if (S.auth && !mode.authenticated) return showLogin();                // nothing is requested until logged in
    $("#logout").hidden = !S.auth;
    if (S.stateless) await initStatelessState();
    await loadClinic();
    ready = true;
  });
  if (ready) render();
})();
</script>
</body>
</html>
